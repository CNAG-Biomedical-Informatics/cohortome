[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortome"
version = "0.1.0"
description = "Open-source workspace for integrated clinical and multimodal cohort research"
authors = [{ name = "Manuel Rueda - CNAG" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.115,<0.116",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<0.31",
  "python-dotenv>=1,<2",
  "pydantic>=2.10,<2.11",
  "jsonschema>=4.18,<5",
  "httpx>=0.28,<0.29",
  "duckdb>=1.5,<1.6",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "redis>=5,<6",
  "rq>=2.0,<3",
]

[project.optional-dependencies]
umap = [
  "umap-learn>=0.5.7,<0.6",
]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
]
ui_test = [
  "pytest>=8.3,<9",
  "playwright>=1.52,<2",
]
dicom = [
  "pydicom>=2.4,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dataset_schemas/*.json"]
