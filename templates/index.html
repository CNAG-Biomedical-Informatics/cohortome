
<!doctype html>
<html lang="en" data-appearance="{{ appearance | default('light') }}" data-deployment="{{ 'desktop' if desktop_mode else 'web' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ branding.name }}</title>
    <script src="/static/js/theme.js"></script>
        <link rel="stylesheet" href="/static/app.css">

  </head>
  <body>
    <div id="applicationRoot" style="display:contents"></div>
    <script id="applicationConfig" type="application/json">{{ {
      "branding": branding, "auth_enabled": auth_enabled, "datasets": datasets,
      "current_dataset_id": current_dataset_id, "default_data_dir": default_data_dir
    } | tojson }}</script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.33.1/cytoscape.min.js"></script>
        <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
        <script type="module" src="/static/app.js"></script>

  </body>
</html>
