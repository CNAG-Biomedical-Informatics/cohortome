name: Test Linux aarch64 desktop package

on:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Also build native test installers (not approved release downloads)
        type: boolean
        default: false
      clean_build:
        description: Rebuild R and Perl without reading or writing the runtime cache
        type: boolean
        default: false
      upload_artifact:
        description: Upload the test bundle only after redistribution review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  viewer:
    uses: ./.github/workflows/desktop-viewer-assets.yml
  package:
    needs: viewer
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ohif-assets
          path: ${{ runner.temp }}/viewer-download
      - name: Extract shared static viewer
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/viewer-download/ohif-assets.tar.gz" -C "$RUNNER_TEMP"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            desktop/requirements-desktop-test.txt
            desktop/requirements-umap-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore verified analysis runtimes
        id: runtimes
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pheno-runtime
            ${{ runner.temp }}/r-runtime
          key: analysis-runtimes-ubuntu24-aarch64-v1-${{ hashFiles('desktop/build_unix_pheno.py', 'desktop/preparation_probe.py', 'desktop/build_linux_r.py', '.github/workflows/desktop-linux-aarch64-test.yml') }}
      - name: Verify runner architecture
        run: test "$(uname -m)" = aarch64
      - name: Install build-host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb xauth build-essential curl libbz2-dev libexpat1-dev libssl-dev zlib1g-dev
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements-desktop-test.txt
          python -m pip install -r desktop/requirements-umap-test.txt
          python -m pip install --no-deps --no-build-isolation .
          npm install --prefix "$RUNNER_TEMP/charts" --no-save --package-lock=false plotly.js-dist-min@2.35.2 cytoscape@3.33.1
      - name: Install extended R packages
        if: steps.runtimes.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev r-bioc-limma r-bioc-edger r-cran-jsonlite r-bioc-deseq2 r-cran-ggplot2 r-cran-biocmanager libcurl4-openssl-dev libssl-dev libxml2-dev
          mkdir -p "$RUNNER_TEMP/r-library"
          echo "R_LIBS_USER=$RUNNER_TEMP/r-library" >> "$GITHUB_ENV"
          R_LIBS_USER="$RUNNER_TEMP/r-library" Rscript --vanilla -e 'options(repos=c(CRAN="https://cloud.r-project.org")); BiocManager::install(c("apeglm", "fgsea", "msigdbr"), ask=FALSE, update=FALSE, Ncpus=2)'
      - name: Build and relocation-test Perl runtime
        if: steps.runtimes.outputs.cache-hit != 'true'
        run: python desktop/build_unix_pheno.py --output "$RUNNER_TEMP/pheno-runtime"
      - name: Build and relocation-test R runtime
        if: steps.runtimes.outputs.cache-hit != 'true'
        run: python desktop/build_linux_r.py --extended --output "$RUNNER_TEMP/r-runtime"
      - name: Build portable test bundle
        run: |
          python desktop/package_desktop.py --with-native --with-umap \
            --ohif-assets "$RUNNER_TEMP/ohif" \
            --chart-modules "$RUNNER_TEMP/charts/node_modules" \
            --perl-runtime "$RUNNER_TEMP/pheno-runtime" \
            --r-runtime "$RUNNER_TEMP/r-runtime" \
            --output "$RUNNER_TEMP/cohortome-linux-aarch64"
      - name: Extract and test packaged backend
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/cohortome-linux-aarch64.tar.gz" -C "$RUNNER_TEMP/extracted"
          python desktop/test_package.py --require-viewer --require-pheno --require-extended-r --require-umap "$RUNNER_TEMP/extracted/cohortome-linux-aarch64/engine"
      - name: Test packaged native window
        run: |
          python desktop/test_native_package.py --xvfb "$RUNNER_TEMP/extracted/cohortome-linux-aarch64/cohortome-desktop"
      - name: Build native test installers
        if: inputs.build_installers
        shell: bash
        run: python desktop/build_installers.py --package "$RUNNER_TEMP/cohortome-linux-aarch64" --output "$RUNNER_TEMP/cohortome-installers"
      - name: Record archive checksum
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "cohortome-linux-aarch64.tar.gz" > "cohortome-linux-aarch64.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifact
        with:
          name: cohortome-linux-aarch64-test
          path: |
            ${{ runner.temp }}/cohortome-linux-aarch64.tar.gz
            ${{ runner.temp }}/cohortome-linux-aarch64.tar.gz.sha256
            ${{ runner.temp }}/cohortome-linux-aarch64/package-manifest.json
            ${{ runner.temp }}/cohortome-installers/installer-manifest.json
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*.deb
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*.AppImage
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*.dmg
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*-setup.exe
          retention-days: 7
          if-no-files-found: error
