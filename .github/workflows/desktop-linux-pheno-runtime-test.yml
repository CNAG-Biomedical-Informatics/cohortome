name: Test Linux CPAN Pheno-Ranker runtime

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Linux architecture
        type: choice
        options: [x86_64, aarch64]
        default: x86_64

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ${{ inputs.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl libbz2-dev libexpat1-dev libssl-dev zlib1g-dev
      - name: Build and relocation-test runtime from CPAN
        run: python desktop/build_unix_pheno.py --output "$RUNNER_TEMP/cohortome-pheno-${{ inputs.architecture }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cohortome-pheno-${{ inputs.architecture }}-test
          path: |
            ${{ runner.temp }}/cohortome-pheno-${{ inputs.architecture }}.tar.gz
            ${{ runner.temp }}/cohortome-pheno-${{ inputs.architecture }}/runtime-manifest.json
          retention-days: 7
          if-no-files-found: error
