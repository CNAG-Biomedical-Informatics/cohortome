name: Build and test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/**'
      - 'datasets/**'
      - 'static/**'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'datasets/**'
      - 'static/**'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/build-and-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core and UI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Isolate test runtime
        run: echo "COHORTOME_RUNTIME_ROOT=$RUNNER_TEMP/cohortome-ci" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install '.[test,ui_test]' wheel
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Core regression tests
        run: |
          python -m pytest -q \
            tests/test_bff.py \
            tests/test_state_io.py \
            tests/test_workspace_identities.py \
            tests/test_cohort_members.py \
            tests/test_dataset_scope_security.py \
            tests/test_query_results.py \
            tests/test_query_sessions.py \
            tests/test_analysis_job_security.py \
            tests/test_model_providers_integration.py
      - name: JavaScript syntax and regression tests
        run: |
          find static/js -name '*.js' -print0 | xargs -0 -n 1 node --experimental-default-type=module --check
          node --experimental-default-type=module --test tests/*.mjs
          node --test tests/*.cjs
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python -m pytest -q tests/test_clarid_table_browser.py tests/test_imaging_table_browser.py
