name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core and UI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Isolate test runtime
        run: echo "COHORTOME_RUNTIME_ROOT=$RUNNER_TEMP/cohortome-ci" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install '.[test,ui_test]' wheel
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Core regression tests
        run: |
          python -m pytest -q \
            tests/test_bff.py \
            tests/test_clinical_store.py \
            tests/test_cohort_filters.py \
            tests/test_cohort_scope.py \
            tests/test_chat_patient_scope.py \
            tests/test_scoped_dashboard.py \
            tests/test_apply_scope_integration.py \
            tests/test_local_agents.py \
            tests/test_local_agent_tools.py \
            tests/test_local_agent_runs.py \
            tests/test_desktop_packaging.py \
            tests/test_clinical_characteristics.py \
            tests/test_patient_clinical_filters.py \
            tests/test_state_io.py \
            tests/test_workspace_identities.py \
            tests/test_cohort_members.py \
            tests/test_dataset_scope_security.py \
            tests/test_dataset_sources.py \
            tests/test_biosamples.py \
            tests/test_patient_overview.py \
            tests/test_variants.py \
            tests/test_query_results.py \
            tests/test_query_sessions.py \
            tests/test_analysis_job_security.py \
            tests/test_model_providers_integration.py
      - name: JavaScript syntax and regression tests
        run: |
          find static/js -name '*.js' -print0 | xargs -0 -n 1 node --experimental-default-type=module --check
          node --experimental-default-type=module --test tests/*.mjs
          node --test tests/*.cjs
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python -m pytest -q tests/test_clarid_table_browser.py tests/test_imaging_table_browser.py tests/test_scope_builder_ui.py tests/test_dashboard_scope_ui.py tests/test_chat_scope_ui.py tests/test_local_agents_ui.py
      - name: Local MCP connector (isolated SDK)
        run: |
          python -m venv "$RUNNER_TEMP/cohortome-mcp"
          "$RUNNER_TEMP/cohortome-mcp/bin/python" -m pip install -r integrations/mcp/requirements.txt 'pytest>=8.3,<9'
          COHORTOME_TEST_APP_PYTHON="$(command -v python)" "$RUNNER_TEMP/cohortome-mcp/bin/python" -m pytest -q integrations/mcp/test_connector.py integrations/mcp/test_desktop_e2e.py
