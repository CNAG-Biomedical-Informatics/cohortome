name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core and UI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Isolate test runtime
        run: echo "COHORTOME_RUNTIME_ROOT=$RUNNER_TEMP/cohortome-ci" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify generated React bundle
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../static/js/react
      - name: Install test dependencies
        run: python -m pip install '.[test,ui_test]' wheel
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Core regression tests
        run: |
          python -m pytest -q \
            tests/test_bff.py \
            tests/test_clinical_store.py \
            tests/test_cohort_filters.py \
            tests/test_cohort_scope.py \
            tests/test_chat_patient_scope.py \
            tests/test_scoped_dashboard.py \
            tests/test_apply_scope_integration.py \
            tests/test_local_agents.py \
            tests/test_local_agent_tools.py \
            tests/test_local_agent_runs.py \
            tests/test_desktop_packaging.py \
            tests/test_desktop_installers.py \
            tests/test_clinical_characteristics.py \
            tests/test_patient_clinical_filters.py \
            tests/test_state_io.py \
            tests/test_workspace_identities.py \
            tests/test_cohort_members.py \
            tests/test_dataset_scope_security.py \
            tests/test_dataset_sources.py \
            tests/test_biosamples.py \
            tests/test_patient_overview.py \
            tests/test_variants.py \
            tests/test_query_results.py \
            tests/test_query_sessions.py \
            tests/test_analysis_job_security.py \
            tests/test_model_providers_integration.py
      - name: JavaScript syntax and regression tests
        run: |
          find static/js -name '*.js' -print0 | xargs -0 -n 1 node --experimental-default-type=module --check
          node --experimental-default-type=module --test tests/*.mjs
          node --test tests/*.cjs
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python -m pytest -q tests/test_clarid_table_browser.py tests/test_imaging_table_browser.py tests/test_scope_builder_ui.py tests/test_dashboard_scope_ui.py tests/test_chat_scope_ui.py tests/test_local_agents_ui.py tests/test_patient_react_ui.py tests/test_multimodal_react_ui.py tests/test_ui_smoke.py::test_timeline_filters_by_available_modalities_including_undated tests/test_ui_smoke.py::test_timeline_availability_error_is_visible_and_retryable tests/test_ui_smoke.py::test_patient_picker_opens_timeline_with_full_clinical_record tests/test_variant_browser_ui.py tests/test_patient_inventory_react_ui.py tests/test_users_admin_react_ui.py tests/test_jobs_react_ui.py tests/test_ui_smoke.py::test_new_chats_share_header_and_appear_immediately tests/test_ui_smoke.py::test_bulk_chat_selection_and_clear_history_scope tests/test_ui_smoke.py::test_shared_chat_folders_move_pin_rename_search_and_delete tests/test_ui_smoke.py::test_admin_can_manage_model_providers_in_app tests/test_ui_smoke.py::test_cohort_library_search_members_and_navigation tests/test_ui_smoke.py::test_cohort_library_loads_sources_and_hands_off tests/test_ui_smoke.py::test_resource_import_catalogue_and_workspace_selection tests/test_ui_smoke.py::test_dataset_admin_react_preserves_drafts_and_saves tests/test_ui_smoke.py::test_admin_can_rebuild_selected_dataset_stores_in_bulk tests/test_ui_smoke.py::test_dataset_bulk_actions_selection_menu_and_ai_review tests/test_ui_smoke.py::test_dataset_picker_uses_accessible_structured_trait_icons_and_legend
      - name: React conversation and settings regressions
        run: |
          python -m pytest -q \
            tests/test_projects_browser.py \
            tests/test_dicom_folder_ui.py \
            tests/test_cohort_export_ui.py \
            tests/test_auth_react_ui.py \
            tests/test_react_activity_ui.py \
            tests/test_ui_smoke.py::test_query_column_sort_resets_page_and_orders_download \
            tests/test_ui_smoke.py::test_query_large_patient_result_is_bounded_and_pages_by_handle \
            tests/test_ui_smoke.py::test_query_general_question_mode_sends_no_workspace_context \
            tests/test_ui_smoke.py::test_custom_script_editor_prepares_and_submits_bound_inputs \
            tests/test_ui_smoke.py::test_analysis_renders_completed_limma_voom_result \
            tests/test_ui_smoke.py::test_analysis_deterministic_trajectory_mounts_plotly_cards \
            tests/test_ui_smoke.py::test_pheno_patient_run_shows_patient_only_cards \
            tests/test_ui_smoke.py::test_pheno_plan_followups_disclose_planning_path_before_click \
            tests/test_ui_smoke.py::test_pheno_multiple_runs_append_and_keep_failures \
            tests/test_ui_smoke.py::test_dataset_about_dialog_preserves_selection_and_renders_safe_docs \
            tests/test_ui_smoke.py::test_settings_about_and_background_notifications \
            tests/test_ui_smoke.py::test_settings_react_draft_survives_navigation_and_failed_save \
            tests/test_ui_smoke.py::test_plot_palette_settings_save_reload_and_reset \
            tests/test_ui_smoke.py::test_chat_sidebar_resize_drag_keyboard_and_reload \
            tests/test_ui_smoke.py::test_export_limits_admin_save_reload_and_nonadmin_hidden \
            tests/test_ui_smoke.py::test_storage_settings_react_failure_retry_and_access \
            tests/test_ui_smoke.py::test_about_react_retry_and_copy_report \
            tests/test_ui_smoke.py::test_deployment_branding_admin_preview_persistence_and_researcher_access
      - name: Local MCP connector (isolated SDK)
        run: |
          python -m venv "$RUNNER_TEMP/cohortome-mcp"
          "$RUNNER_TEMP/cohortome-mcp/bin/python" -m pip install -r integrations/mcp/requirements.txt 'pytest>=8.3,<9'
          COHORTOME_TEST_APP_PYTHON="$(command -v python)" "$RUNNER_TEMP/cohortome-mcp/bin/python" -m pytest -q integrations/mcp/test_connector.py integrations/mcp/test_desktop_e2e.py
