name: Test Windows x86_64 desktop package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-desktop-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements-desktop-test.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip install pytest
          npm install --prefix "$RUNNER_TEMP/charts" --no-save --package-lock=false plotly.js-dist-min@2.35.2 cytoscape@3.33.1
      - name: Test Windows state locking and writes
        run: python -m pytest -q tests/test_state_io.py --noconftest
      - name: Set up Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.42'
          distribution: strawberry
      - name: Stage and relocation-test Perl runtime
        run: python desktop/build_windows_pheno.py --output "$RUNNER_TEMP/pheno-runtime"
      - name: Build portable test bundle
        run: |
          python desktop/package_desktop.py --with-native \
            --chart-modules "$RUNNER_TEMP/charts/node_modules" \
            --pheno-runtime "$RUNNER_TEMP/pheno-runtime" \
            --output "$RUNNER_TEMP/cohortome-windows-x86_64"
      - name: Extract and test packaged backend
        run: |
          python -m zipfile -e "$RUNNER_TEMP/cohortome-windows-x86_64.zip" "$RUNNER_TEMP/extracted"
          python desktop/test_package.py --require-pheno "$RUNNER_TEMP/extracted/cohortome-windows-x86_64/engine"
      - name: Test packaged native window
        run: python desktop/test_native_package.py "$RUNNER_TEMP/extracted/cohortome-windows-x86_64/cohortome-desktop.exe"
      - name: Record archive checksum
        run: |
          cd "$RUNNER_TEMP"
          sha256sum cohortome-windows-x86_64.zip > cohortome-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cohortome-windows-x86_64-test
          path: |
            ${{ runner.temp }}/cohortome-windows-x86_64.zip
            ${{ runner.temp }}/cohortome-windows-x86_64.zip.sha256
            ${{ runner.temp }}/cohortome-windows-x86_64/package-manifest.json
          retention-days: 7
          if-no-files-found: error
