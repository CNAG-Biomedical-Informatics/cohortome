name: Test Windows x86_64 desktop package

on:
  workflow_dispatch:
    inputs:
      r_runtime_run_id:
        description: Run ID with the verified r-runtime-windows-x86_64 artifact
        required: false
        type: string
      upload_artifact:
        description: Upload the test bundle only after redistribution review
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  viewer:
    uses: ./.github/workflows/desktop-viewer-assets.yml
  package:
    needs: viewer
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ohif-assets
          path: ${{ runner.temp }}/viewer-download
      - name: Extract shared static viewer
        shell: pwsh
        run: python -m tarfile -e "$env:RUNNER_TEMP/viewer-download/ohif-assets.tar.gz" "$env:RUNNER_TEMP"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            desktop/requirements-desktop-test.txt
            desktop/requirements-umap-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements-desktop-test.txt
          python -m pip install -r desktop/requirements-umap-test.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip install pytest
          npm install --prefix "$RUNNER_TEMP/charts" --no-save --package-lock=false plotly.js-dist-min@2.35.2 cytoscape@3.33.1
      - name: Test Windows state locking and writes
        run: python -m pytest -q tests/test_state_io.py --noconftest
      - name: Set up Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.42'
          distribution: strawberry
      - name: Stage and relocation-test Perl runtime
        shell: pwsh
        run: |
          $perlExe = (Get-Command perl.exe -CommandType Application | Select-Object -First 1).Source
          $strawberryRoot = Split-Path (Split-Path (Split-Path $perlExe))
          $compilerExe = Join-Path $strawberryRoot 'c/bin/gcc.exe'
          if (-not (Test-Path -LiteralPath $perlExe -PathType Leaf)) { throw "Missing Perl: $perlExe" }
          if (-not (Test-Path -LiteralPath $compilerExe -PathType Leaf)) { throw "Missing Strawberry compiler: $compilerExe" }
          Write-Host "Selected Perl: $perlExe"
          Write-Host "Selected compiler: $compilerExe"
          python desktop/build_windows_pheno.py --perl "$perlExe" --compiler "$compilerExe" --output "$env:RUNNER_TEMP/pheno-runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Perl runtime staging failed' }
      - name: Build R runtime on this runner
        if: inputs.r_runtime_run_id == ''
        uses: ./.github/actions/build-native-r
      - name: Download verified R runtime
        if: inputs.r_runtime_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: r-runtime-windows-x86_64
          run-id: ${{ inputs.r_runtime_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r-artifact
      - name: Extract verified R runtime
        if: inputs.r_runtime_run_id != ''
        run: python -m zipfile -e "$RUNNER_TEMP/r-artifact/r-runtime.zip" "$RUNNER_TEMP"
      - name: Build portable test bundle with R
        run: |
          python desktop/package_desktop.py --with-native --with-umap \
            --ohif-assets "$RUNNER_TEMP/ohif" \
            --chart-modules "$RUNNER_TEMP/charts/node_modules" \
            --perl-runtime "$RUNNER_TEMP/pheno-runtime" \
            --r-runtime "$RUNNER_TEMP/r-runtime" \
            --output "$RUNNER_TEMP/cohortome-windows-x86_64"
      - name: Extract and test packaged backend
        run: |
          python -m zipfile -e "$RUNNER_TEMP/cohortome-windows-x86_64.zip" "$RUNNER_TEMP/extracted"
          python desktop/test_package.py --require-viewer --require-pheno --require-umap --require-extended-r "$RUNNER_TEMP/extracted/cohortome-windows-x86_64/engine"
      - name: Test packaged native window
        run: python desktop/test_native_package.py "$RUNNER_TEMP/extracted/cohortome-windows-x86_64/cohortome-desktop.exe"
      - name: Record archive checksum
        run: |
          cd "$RUNNER_TEMP"
          sha256sum cohortome-windows-x86_64.zip > cohortome-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifact
        with:
          name: cohortome-windows-x86_64-test
          path: |
            ${{ runner.temp }}/cohortome-windows-x86_64.zip
            ${{ runner.temp }}/cohortome-windows-x86_64.zip.sha256
            ${{ runner.temp }}/cohortome-windows-x86_64/package-manifest.json
          retention-days: 7
          if-no-files-found: error
