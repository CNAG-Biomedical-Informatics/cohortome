name: Test macOS and Windows R runtimes

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Test Windows only (skip both macOS builds)
        type: boolean
        default: false
      upload_artifact:
        description: Upload the runtime only after redistribution review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"runner":"windows-2022","platform":"windows-x86_64"}]' || '[{"runner":"macos-15","platform":"macos-arm64"},{"runner":"macos-15-intel","platform":"macos-x86_64"},{"runner":"windows-2022","platform":"windows-x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/build-native-r
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifact
        with:
          name: r-runtime-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/r-runtime.zip
            ${{ runner.temp }}/r-runtime.tar.gz
            ${{ runner.temp }}/r-runtime/runtime-manifest.json
          retention-days: 7
          if-no-files-found: error
