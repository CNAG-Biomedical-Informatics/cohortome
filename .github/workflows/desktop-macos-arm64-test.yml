name: Test macOS Apple Silicon desktop package

on:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Also build native test installers (not approved release downloads)
        type: boolean
        default: false
      r_runtime_run_id:
        description: Run ID with the verified r-runtime-macos-arm64 artifact
        required: false
        type: string
      upload_artifact:
        description: Upload the test bundle only after redistribution review
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  viewer:
    uses: ./.github/workflows/desktop-viewer-assets.yml
  package:
    needs: viewer
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ohif-assets
          path: ${{ runner.temp }}/viewer-download
      - name: Extract shared static viewer
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/viewer-download/ohif-assets.tar.gz" -C "$RUNNER_TEMP"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            desktop/requirements-desktop-test.txt
            desktop/requirements-umap-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements-desktop-test.txt
          python -m pip install -r desktop/requirements-umap-test.txt
          python -m pip install --no-deps --no-build-isolation .
          npm install --prefix "$RUNNER_TEMP/charts" --no-save --package-lock=false plotly.js-dist-min@2.35.2 cytoscape@3.33.1
      - name: Build and relocation-test Perl runtime
        run: python desktop/build_unix_pheno.py --output "$RUNNER_TEMP/pheno-runtime"
      - name: Build R runtime on this runner
        if: inputs.r_runtime_run_id == ''
        uses: ./.github/actions/build-native-r
      - name: Download verified R runtime
        if: inputs.r_runtime_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: r-runtime-macos-arm64
          run-id: ${{ inputs.r_runtime_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r-artifact
      - name: Extract verified R runtime
        if: inputs.r_runtime_run_id != ''
        run: tar -xzf "$RUNNER_TEMP/r-artifact/r-runtime.tar.gz" -C "$RUNNER_TEMP"
      - name: Build portable test bundle with R
        run: |
          python desktop/package_desktop.py --with-native --with-umap \
            --ohif-assets "$RUNNER_TEMP/ohif" \
            --chart-modules "$RUNNER_TEMP/charts/node_modules" \
            --perl-runtime "$RUNNER_TEMP/pheno-runtime" \
            --r-runtime "$RUNNER_TEMP/r-runtime" \
            --output "$RUNNER_TEMP/cohortome-macos-arm64"
      - name: Extract and test packaged backend
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/cohortome-macos-arm64.tar.gz" -C "$RUNNER_TEMP/extracted"
          python desktop/test_package.py --require-viewer --require-pheno --require-umap --require-extended-r "$RUNNER_TEMP/extracted/cohortome-macos-arm64/engine"
      - name: Check ad-hoc signatures
        run: |
          codesign --verify --strict "$RUNNER_TEMP/extracted/cohortome-macos-arm64/cohortome-desktop"
          codesign --verify --strict "$RUNNER_TEMP/extracted/cohortome-macos-arm64/engine/cohortome-backend"
      - name: Test packaged native window
        run: python desktop/test_native_package.py "$RUNNER_TEMP/extracted/cohortome-macos-arm64/cohortome-desktop"
      - name: Build native test installers
        if: inputs.build_installers
        shell: bash
        run: python desktop/build_installers.py --package "$RUNNER_TEMP/cohortome-macos-arm64" --output "$RUNNER_TEMP/cohortome-installers"
      - name: Record archive checksum
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 cohortome-macos-arm64.tar.gz > cohortome-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifact
        with:
          name: cohortome-macos-arm64-test
          path: |
            ${{ runner.temp }}/cohortome-macos-arm64.tar.gz
            ${{ runner.temp }}/cohortome-macos-arm64.tar.gz.sha256
            ${{ runner.temp }}/cohortome-macos-arm64/package-manifest.json
            ${{ runner.temp }}/cohortome-installers/installer-manifest.json
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*.deb
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*.AppImage
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*.dmg
            ${{ runner.temp }}/cohortome-installers/target/release/bundle/**/*-setup.exe
          retention-days: 7
          if-no-files-found: error
