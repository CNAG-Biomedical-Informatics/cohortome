name: Test Docker deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: Docker linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: cohortome-smoke
      COMPOSE_FILE: docker/docker-compose.yml
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build on native runner (no publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: cohortome:pilot
          cache-from: type=gha,scope=cohortome-docker-${{ matrix.arch }}
          cache-to: type=gha,scope=cohortome-docker-${{ matrix.arch }},mode=max
      - name: Create isolated synthetic test settings
        run: |
          test ! -e docker/.env
          python3 - <<'PY'
          import json, secrets
          from pathlib import Path
          users = [{"username": "smoke", "password": "synthetic-test-only", "role": "admin", "groups": ["admin"]}]
          Path('docker/.env').write_text('COHORTOME_SESSION_SECRET=' + secrets.token_hex(32) + '\nCOHORTOME_LOCAL_USERS_JSON=' + json.dumps(users) + '\n')
          PY
      - name: Start web, Redis and worker
        run: docker compose up -d --no-build web worker redis
      - name: Test login, queries and a queued R analysis
        run: docker compose exec -T web python scripts/test_docker_deployment.py
      - name: Restart services and check persisted settings
        run: |
          docker compose restart web worker
          docker compose exec -T web python scripts/test_docker_deployment.py --after-restart
      - name: Deployment logs
        if: always()
        run: docker compose logs --no-color --tail=100 web worker redis
      - name: Remove this runner's test stack
        if: always()
        run: docker compose down --volumes
