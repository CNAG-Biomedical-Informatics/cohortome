name: Test Linux ARM64 R runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build-host R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-bioc-limma r-bioc-edger r-cran-jsonlite
      - name: Stage and relocation-test R runtime
        run: python desktop/build_linux_r.py --output "$RUNNER_TEMP/cohortome-r-aarch64"
      - uses: actions/upload-artifact@v4
        with:
          name: cohortome-r-aarch64-test
          path: |
            ${{ runner.temp }}/cohortome-r-aarch64.tar.gz
            ${{ runner.temp }}/cohortome-r-aarch64/runtime-manifest.json
          retention-days: 7
          if-no-files-found: error
