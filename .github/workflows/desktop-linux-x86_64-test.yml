name: Build Linux x86_64 desktop package

on:
  workflow_call:
    inputs:
      build_installers:
        type: boolean
        default: false
      clean_build:
        type: boolean
        default: false
      upload_artifact:
        type: boolean
        default: false
      checkout_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  viewer:
    uses: ./.github/workflows/desktop-viewer-assets.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      artifact_name: ohif-assets-linux-x86_64
  package:
    needs: viewer
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ohif-assets-linux-x86_64
          path: ${{ runner.temp }}/viewer-download
      - name: Extract shared static viewer
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/viewer-download/ohif-assets.tar.gz" -C "$RUNNER_TEMP"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            desktop/requirements-desktop-test.txt
            desktop/requirements-umap-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore verified analysis runtimes
        id: runtimes
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pheno-runtime
            ${{ runner.temp }}/r-runtime
          key: analysis-runtimes-ubuntu22-x86_64-v1-${{ hashFiles('desktop/build_unix_pheno.py', 'desktop/preparation_probe.py', 'desktop/build_linux_r.py', '.github/workflows/desktop-linux-x86_64-test.yml') }}
      - name: Install build-host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libtbb12 patchelf xvfb xauth build-essential curl libbz2-dev libexpat1-dev libssl-dev zlib1g-dev
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements-desktop-test.txt
          python -m pip install -r desktop/requirements-umap-test.txt
          python -m pip install --no-deps --no-build-isolation .
          npm install --prefix "$RUNNER_TEMP/charts" --no-save --package-lock=false plotly.js-dist-min@2.35.2 cytoscape@3.33.1
      - name: Install extended R packages
        if: steps.runtimes.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev libcurl4-openssl-dev libssl-dev libxml2-dev
          mkdir -p "$RUNNER_TEMP/r-library" "$RUNNER_TEMP/r-empty-site"
          echo "R_LIBS_USER=$RUNNER_TEMP/r-library" >> "$GITHUB_ENV"
          echo "R_LIBS_SITE=$RUNNER_TEMP/r-empty-site" >> "$GITHUB_ENV"
          # The hosted image's R is newer than Ubuntu's Rcpp/Bioconductor
          # packages. Build a consistent library without that old site-library.
          R_LIBS_USER="$RUNNER_TEMP/r-library" R_LIBS_SITE="$RUNNER_TEMP/r-empty-site" Rscript --vanilla -e '
            options(repos=c(CRAN="https://cloud.r-project.org"))
            install.packages("BiocManager")
            required <- c("limma", "edgeR", "jsonlite", "DESeq2", "apeglm", "fgsea", "msigdbr", "ggplot2")
            BiocManager::install(required, ask=FALSE, update=FALSE, Ncpus=2)
            missing <- required[!vapply(required, requireNamespace, logical(1), quietly=TRUE)]
            if (length(missing)) stop("R packages failed to install/load: ", paste(missing, collapse=", "))'
      - name: Build and relocation-test Perl runtime
        if: steps.runtimes.outputs.cache-hit != 'true'
        run: python desktop/build_unix_pheno.py --output "$RUNNER_TEMP/pheno-runtime"
      - name: Build and relocation-test R runtime
        if: steps.runtimes.outputs.cache-hit != 'true'
        run: python desktop/build_linux_r.py --extended --output "$RUNNER_TEMP/r-runtime"
      - name: Build portable test bundle
        run: |
          python desktop/package_desktop.py --with-native --with-umap \
            --ohif-assets "$RUNNER_TEMP/ohif" \
            --chart-modules "$RUNNER_TEMP/charts/node_modules" \
            --perl-runtime "$RUNNER_TEMP/pheno-runtime" \
            --r-runtime "$RUNNER_TEMP/r-runtime" \
            --output "$RUNNER_TEMP/cohortome-linux-x86_64"
      - name: Extract and test packaged backend
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/cohortome-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/extracted"
          python desktop/test_package.py --require-viewer --require-pheno --require-extended-r --require-umap "$RUNNER_TEMP/extracted/cohortome-linux-x86_64/engine"
      - name: Test packaged native window
        run: |
          python desktop/test_native_package.py --xvfb "$RUNNER_TEMP/extracted/cohortome-linux-x86_64/cohortome-desktop"
      - name: Build native test installers
        if: inputs.build_installers
        shell: bash
        run: python desktop/build_installers.py --package "$RUNNER_TEMP/cohortome-linux-x86_64" --output "$RUNNER_TEMP/cohortome-installers"
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifact && inputs.build_installers
        with:
          name: cohortome-linux-x86_64-installer-test
          path: ${{ runner.temp }}/cohortome-installers/downloads/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
