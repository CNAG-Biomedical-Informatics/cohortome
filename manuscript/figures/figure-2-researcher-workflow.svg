<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">COHORTome researcher workflow</title>
  <desc id="desc">A six-step workflow from authorized workspace selection through longitudinal and multimodal orientation, governed cohort definition, saved cohort creation, curated analysis, and evidence review, with governance and provenance controls under every step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#52636d"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#13847c"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" letter-spacing="0">
    <text x="64" y="72" font-size="28" font-weight="700" fill="#1c2b33">COHORT</text>
    <text x="178" y="72" font-size="28" font-weight="500" fill="#13847c">ome</text>
    <text x="64" y="126" font-size="42" font-weight="700" fill="#1c2b33">From an authorized workspace to reviewable evidence</text>
    <text x="64" y="166" font-size="26" fill="#52636d">The cohort remains the stable unit connecting exploration, analysis, and provenance</text>

    <rect x="64" y="218" width="1472" height="442" rx="8" fill="#f6f8fa" stroke="#d9e0e4" stroke-width="2"/>
    <text x="92" y="260" font-size="23" font-weight="700" fill="#52636d">RESEARCH PATH</text>
    <line x1="180" y1="393" x2="1422" y2="393" stroke="#b6c3c9" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(104 304)">
      <circle cx="76" cy="89" r="60" fill="#1c2b33"/>
      <text x="76" y="101" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">1</text>
      <text x="76" y="190" text-anchor="middle" font-size="28" font-weight="700" fill="#1c2b33">Select</text>
      <text x="76" y="225" text-anchor="middle" font-size="24" fill="#52636d">authorized</text>
      <text x="76" y="255" text-anchor="middle" font-size="24" fill="#52636d">workspace</text>
    </g>
    <g transform="translate(344 304)">
      <circle cx="76" cy="89" r="60" fill="#52758a"/>
      <text x="76" y="101" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">2</text>
      <text x="76" y="190" text-anchor="middle" font-size="28" font-weight="700" fill="#1c2b33">Orient</text>
      <text x="76" y="225" text-anchor="middle" font-size="24" fill="#52636d">patients, time points,</text>
      <text x="76" y="255" text-anchor="middle" font-size="24" fill="#52636d">modalities, readiness</text>
    </g>
    <g transform="translate(584 304)">
      <circle cx="76" cy="89" r="60" fill="#13847c"/>
      <text x="76" y="101" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">3</text>
      <text x="76" y="190" text-anchor="middle" font-size="28" font-weight="700" fill="#1c2b33">Define</text>
      <text x="76" y="225" text-anchor="middle" font-size="24" fill="#52636d">governed query</text>
      <text x="76" y="255" text-anchor="middle" font-size="24" fill="#52636d">and inclusion logic</text>
    </g>
    <g transform="translate(824 304)">
      <circle cx="76" cy="89" r="60" fill="#2f8f63"/>
      <text x="76" y="101" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">4</text>
      <text x="76" y="190" text-anchor="middle" font-size="28" font-weight="700" fill="#1c2b33">Save</text>
      <text x="76" y="225" text-anchor="middle" font-size="24" fill="#52636d">versioned cohort</text>
      <text x="76" y="255" text-anchor="middle" font-size="24" fill="#52636d">and membership</text>
    </g>
    <g transform="translate(1064 304)">
      <circle cx="76" cy="89" r="60" fill="#d49b3d"/>
      <text x="76" y="101" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">5</text>
      <text x="76" y="190" text-anchor="middle" font-size="28" font-weight="700" fill="#1c2b33">Analyze</text>
      <text x="76" y="225" text-anchor="middle" font-size="24" fill="#52636d">feature matrix or</text>
      <text x="76" y="255" text-anchor="middle" font-size="24" fill="#52636d">curated workflow</text>
    </g>
    <g transform="translate(1304 304)">
      <circle cx="76" cy="89" r="60" fill="#5f6f9b"/>
      <text x="76" y="101" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">6</text>
      <text x="76" y="190" text-anchor="middle" font-size="28" font-weight="700" fill="#1c2b33">Review</text>
      <text x="76" y="225" text-anchor="middle" font-size="24" fill="#52636d">outputs, logs,</text>
      <text x="76" y="255" text-anchor="middle" font-size="24" fill="#52636d">and evidence</text>
    </g>

    <path d="M1380 605 C1380 686 660 694 660 619" fill="none" stroke="#13847c" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-teal)"/>
    <rect x="774" y="655" width="492" height="38" rx="4" fill="#ffffff"/>
    <text x="1020" y="680" text-anchor="middle" font-size="21" font-weight="700" fill="#13847c">refine transparently without losing cohort history</text>

    <rect x="64" y="694" width="1472" height="142" rx="8" fill="#1c2b33"/>
    <text x="92" y="735" font-size="23" font-weight="700" fill="#70d0c7">CONTROLS THAT TRAVEL WITH THE WORK</text>
    <g font-size="23" fill="#ffffff">
      <text x="92" y="787">Access policy</text>
      <text x="301" y="787">Readiness checks</text>
      <text x="539" y="787">Query audit</text>
      <text x="730" y="787">Cohort provenance</text>
      <text x="989" y="787">Method manifest</text>
      <text x="1217" y="787">Outputs and logs</text>
    </g>
    <g fill="#70d0c7">
      <circle cx="76" cy="779" r="7"/><circle cx="285" cy="779" r="7"/><circle cx="523" cy="779" r="7"/>
      <circle cx="714" cy="779" r="7"/><circle cx="973" cy="779" r="7"/><circle cx="1201" cy="779" r="7"/>
    </g>
    <text x="92" y="819" font-size="21" fill="#cbd7dc">Optional LLM assistance is policy-controlled, auditable, and never substitutes for cohort definitions or recorded analysis outputs.</text>

    <rect x="384" y="224" width="432" height="58" rx="6" fill="#fff6e8" stroke="#d7a34c" stroke-width="2"/>
    <text x="600" y="261" text-anchor="middle" font-size="22" font-weight="700" fill="#7d5a22">Optional LLM assistance: orient and formulate</text>
    <path d="M500 282 V315" stroke="#d7a34c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M700 282 V315" stroke="#d7a34c" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
