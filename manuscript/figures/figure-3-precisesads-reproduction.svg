<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PRECISESADS computational reproduction design</title>
  <desc id="desc">A schematic, prespecified workflow for using the authorized PRECISESADS release to test whether COHORTome can reproduce a previously published analysis. No patient counts or biological results are asserted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#52636d"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" letter-spacing="0">
    <text x="64" y="72" font-size="28" font-weight="700" fill="#1c2b33">COHORT</text>
    <text x="178" y="72" font-size="28" font-weight="500" fill="#13847c">ome</text>
    <text x="64" y="126" font-size="42" font-weight="700" fill="#1c2b33">PRECISESADS reference-case reproduction</text>
    <text x="64" y="166" font-size="26" fill="#52636d">A prespecified computational validation, not an independent biological discovery study</text>

    <rect x="1180" y="52" width="356" height="70" rx="6" fill="#fff6e8" stroke="#d7a34c" stroke-width="2"/>
    <text x="1358" y="82" text-anchor="middle" font-size="20" font-weight="700" fill="#7d5a22">SCHEMATIC</text>
    <text x="1358" y="108" text-anchor="middle" font-size="20" fill="#7d5a22">no study results shown</text>

    <rect x="64" y="218" width="1472" height="96" rx="8" fill="#eef4f7" stroke="#adc1cd" stroke-width="2"/>
    <text x="92" y="256" font-size="23" font-weight="700" fill="#52758a">COLLABORATIVE GOVERNANCE</text>
    <text x="92" y="291" font-size="25" fill="#1c2b33">3TR data stewards + FPS PRECISESADS collaborators + CNAG analysis team</text>
    <path d="M1120 266h350" stroke="#52758a" stroke-width="3" stroke-dasharray="8 7"/>
    <circle cx="1150" cy="266" r="10" fill="#52758a"/><circle cx="1295" cy="266" r="10" fill="#13847c"/><circle cx="1440" cy="266" r="10" fill="#2f8f63"/>

    <text x="64" y="368" font-size="23" font-weight="700" fill="#52636d">PRESPECIFIED REPRODUCTION PATH</text>
    <line x1="190" y1="506" x2="1410" y2="506" stroke="#b6c3c9" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(76 398)">
      <rect width="215" height="216" rx="8" fill="#f6f8fa" stroke="#ccd5da" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#1c2b33"/>
      <text x="38" y="51" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">1</text>
      <text x="68" y="49" font-size="26" font-weight="700" fill="#1c2b33">Authorize</text>
      <text x="24" y="92" font-size="20" fill="#52636d">Approved release</text>
      <text x="24" y="124" font-size="20" fill="#52636d">from 3TR Omics DM</text>
      <text x="24" y="156" font-size="20" fill="#52636d">Warehouse</text>
      <text x="24" y="194" font-size="20" font-weight="700" fill="#52758a">access + data version</text>
    </g>

    <g transform="translate(322 398)">
      <rect width="215" height="216" rx="8" fill="#eef4f7" stroke="#adc1cd" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#52758a"/>
      <text x="38" y="51" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">2</text>
      <text x="68" y="49" font-size="26" font-weight="700" fill="#1c2b33">Freeze</text>
      <text x="24" y="92" font-size="20" fill="#52636d">Checksums, schema,</text>
      <text x="24" y="124" font-size="20" fill="#52636d">provenance, and</text>
      <text x="24" y="156" font-size="20" fill="#52636d">analysis plan</text>
      <text x="24" y="194" font-size="20" font-weight="700" fill="#52758a">immutable inputs</text>
    </g>

    <g transform="translate(568 398)">
      <rect width="215" height="216" rx="8" fill="#edf8f6" stroke="#8ecac5" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#13847c"/>
      <text x="38" y="51" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">3</text>
      <text x="68" y="49" font-size="26" font-weight="700" fill="#1c2b33">Harmonize</text>
      <text x="24" y="92" font-size="20" fill="#52636d">Map identifiers,</text>
      <text x="24" y="124" font-size="20" fill="#52636d">phenotypes, assays,</text>
      <text x="24" y="156" font-size="20" fill="#52636d">and time points</text>
      <text x="24" y="194" font-size="20" font-weight="700" fill="#13847c">QC report</text>
    </g>

    <g transform="translate(814 398)">
      <rect width="215" height="216" rx="8" fill="#eef7f2" stroke="#91c7aa" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#2f8f63"/>
      <text x="38" y="51" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">4</text>
      <text x="68" y="49" font-size="26" font-weight="700" fill="#1c2b33">Recreate</text>
      <text x="24" y="92" font-size="20" fill="#52636d">Prespecified cohort,</text>
      <text x="24" y="124" font-size="20" fill="#52636d">variables, contrasts,</text>
      <text x="24" y="156" font-size="20" fill="#52636d">and method</text>
      <text x="24" y="194" font-size="20" font-weight="700" fill="#2f8f63">analysis manifest</text>
    </g>

    <g transform="translate(1060 398)">
      <rect width="215" height="216" rx="8" fill="#fff6e8" stroke="#d7a34c" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#d49b3d"/>
      <text x="38" y="51" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">5</text>
      <text x="68" y="49" font-size="26" font-weight="700" fill="#1c2b33">Compare</text>
      <text x="24" y="92" font-size="20" fill="#52636d">Direction, effect,</text>
      <text x="24" y="124" font-size="20" fill="#52636d">ranking, uncertainty,</text>
      <text x="24" y="156" font-size="20" fill="#52636d">and discrepancies</text>
      <text x="24" y="194" font-size="20" font-weight="700" fill="#9a6b22">agreement metrics</text>
    </g>

    <g transform="translate(1306 398)">
      <rect width="215" height="216" rx="8" fill="#eef1f7" stroke="#afb8cf" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#5f6f9b"/>
      <text x="38" y="51" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">6</text>
      <text x="68" y="49" font-size="26" font-weight="700" fill="#1c2b33">Review</text>
      <text x="24" y="92" font-size="20" fill="#52636d">Collaborator review</text>
      <text x="24" y="124" font-size="20" fill="#52636d">of interpretation,</text>
      <text x="24" y="156" font-size="20" fill="#52636d">limits, and release</text>
      <text x="24" y="194" font-size="20" font-weight="700" fill="#5f6f9b">signed evidence</text>
    </g>

    <rect x="64" y="672" width="716" height="164" rx="8" fill="#edf8f6" stroke="#8ecac5" stroke-width="2"/>
    <text x="92" y="714" font-size="25" font-weight="700" fill="#0e6964">What this case can test</text>
    <circle cx="103" cy="755" r="7" fill="#13847c"/>
    <text x="124" y="764" font-size="23" fill="#1c2b33">End-to-end harmonization and cohort reconstruction</text>
    <circle cx="103" cy="800" r="7" fill="#13847c"/>
    <text x="124" y="809" font-size="23" fill="#1c2b33">Computational agreement with a previously published result</text>

    <rect x="808" y="672" width="728" height="164" rx="8" fill="#fff6e8" stroke="#d7a34c" stroke-width="2"/>
    <text x="836" y="714" font-size="25" font-weight="700" fill="#7d5a22">Evidence still required</text>
    <circle cx="847" cy="755" r="7" fill="#d49b3d"/>
    <text x="868" y="764" font-size="23" fill="#1c2b33">Authorized counts, exclusions, effects, and uncertainty</text>
    <circle cx="847" cy="800" r="7" fill="#d49b3d"/>
    <text x="868" y="809" font-size="23" fill="#1c2b33">Discrepancy analysis and collaborator-approved interpretation</text>
  </g>
</svg>
