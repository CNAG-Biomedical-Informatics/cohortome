version: 1
items:
  - id: synthetic-custom-script
    name: Custom Python / R script (synthetic prototype)
    category: Custom analysis
    kind: custom_script
    runner_type: container
    runner_ref: synthetic_custom_script
    execution_backend: job
    job_timeout_seconds: 180
    description: Run your own Python or R analysis using automatically prepared patient, clinical and assay objects.
    guidance: Prepare the template in Inputs, optionally complete it with an external AI, then paste the script and run. Synthetic autoimmune demo only.
    default_prompt: Run the custom analysis on the prepared synthetic inputs.
    execution_mode: deterministic
    requires_detailed_access: true
    requires_single_dataset_workspace: true
    supports_compare_mode: true
    tags: [custom, python, r, synthetic, sandbox]

  - id: trajectory-single
    name: Trajectory analysis
    category: Trajectories
    kind: trajectory
    runner_type: builtin
    runner_ref: trajectory
    description: Plot a longitudinal clinical measure over time for the active scope.
    guidance: Choose a clinical measurement in Inputs. Repeated dated observations are required.
    default_prompt: Show the trajectory of Leukocyte Count over time.
    execution_mode: deterministic
    required_clinical_representation: snapshot
    tags: [trajectory, longitudinal, deterministic]

  - id: trajectory-compare
    name: Trajectory comparison
    category: Trajectories
    kind: trajectory_compare
    runner_type: builtin
    runner_ref: trajectory_compare
    description: Compare longitudinal behavior of a clinical measure between Cohort A and Cohort B.
    guidance: Select saved cohorts for A and B, then choose a measurement with repeated dated observations in both groups.
    default_prompt: Compare the active analysis scopes using Leukocyte Count trajectories.
    execution_mode: deterministic
    required_clinical_representation: snapshot
    default_compare_mode: true
    supports_compare_mode: true
    tags: [trajectory, compare, longitudinal]

  - id: treatment-response
    name: Treatment response trajectory
    category: Trajectories
    kind: treatment_response
    runner_type: builtin
    runner_ref: treatment_response
    description: Track a clinical marker over time relative to treatment exposure.
    guidance: Choose the measurement in Inputs; specify the treatment in the prompt.
    default_prompt: Show response to Infliximab using CRP.
    execution_mode: deterministic
    required_clinical_representation: snapshot
    tags: [trajectory, treatment-response, deterministic]

  - id: survival-single
    name: Kaplan-Meier survival
    category: Survival
    kind: survival
    runner_type: builtin
    runner_ref: survival
    description: Estimate time-to-event behavior for the active scope using a clinical threshold event.
    guidance: Choose the measurement in Inputs; edit the event operator and threshold in the prompt.
    default_prompt: Show a Kaplan-Meier curve for time to Clinical relapse > 0.
    execution_mode: deterministic
    required_clinical_representation: snapshot
    tags: [survival, kaplan-meier, deterministic]

  - id: survival-compare
    name: Kaplan-Meier comparison
    category: Survival
    kind: survival_compare
    runner_type: builtin
    runner_ref: survival_compare
    description: Compare time-to-event behavior between Cohort A and Cohort B.
    guidance: Select saved cohorts for A and B before running.
    default_prompt: Compare Cohort A and Cohort B with Kaplan-Meier for time to Clinical relapse > 0.
    execution_mode: deterministic
    required_clinical_representation: snapshot
    default_compare_mode: true
    supports_compare_mode: true
    tags: [survival, kaplan-meier, compare, deterministic]

  - id: transcriptomics-expression
    name: Transcriptomics expression summary
    category: Assays
    kind: transcriptomics_expression
    runner_type: builtin
    runner_ref: transcriptomics_expression
    description: Summarize scoped expression for a selected gene across available raw-count assays.
    guidance: Replace the gene identifier in the prompt if needed.
    default_prompt: Show expression of ENSG00002700028 in the current Analysis scope.
    execution_mode: deterministic
    requires_assays: true
    required_modalities: [transcriptomics]
    required_data_types: [raw_counts]
    analysis_level: sample
    tags: [transcriptomics, expression, deterministic]

  - id: transcriptomics-medication-compare
    name: Transcriptomics medication comparison
    category: Assays
    kind: assay_compare
    runner_type: builtin
    runner_ref: transcriptomics_medication_compare
    description: Compare raw-count transcriptomic profiles across medication-defined groups in the current Analysis scope.
    guidance: Works best when the workspace contains medication-aligned raw-count transcriptomics assays.
    default_prompt: Explain differences in gene expression according to medication.
    execution_mode: deterministic
    requires_assays: true
    required_modalities: [transcriptomics]
    required_data_types: [raw_counts]
    analysis_level: sample
    tags: [transcriptomics, volcano, medication, deterministic]

  - id: transcriptomics-deseq2-differential-expression
    name: DESeq2 differential expression
    category: Assays
    kind: differential_expression
    execution_backend: job
    expected_runtime: long
    job_timeout_seconds: 3600
    runner_type: rscript
    runner_ref: transcriptomics_deseq2_differential_expression
    description: Run a curated DESeq2 differential-expression analysis between Cohort A and Cohort B from one selected raw-count assay.
    guidance: Select Cohort A and Cohort B before running. This first version requires at least two samples per cohort and one sample per patient, so baseline-only or one-sample-per-patient inputs are preferred.
    default_prompt: Run DESeq2 differential expression between Cohort A and Cohort B for the selected assay.
    execution_mode: deterministic
    default_compare_mode: true
    supports_compare_mode: true
    minimum_samples_per_cohort: 2
    requires_detailed_access: true
    requires_assays: true
    required_modalities: [transcriptomics]
    required_data_types: [raw_counts]
    analysis_level: sample
    tags: [transcriptomics, differential-expression, deseq2, background, rscript]

  - id: transcriptomics-limma-voom-differential-expression
    name: limma-voom differential expression
    category: Assays
    kind: differential_expression
    execution_backend: job
    expected_runtime: long
    job_timeout_seconds: 3600
    runner_type: rscript
    runner_ref: transcriptomics_limma_voom_differential_expression
    description: Run limma-voom differential expression on RSEM expected counts between Cohort A and Cohort B.
    guidance: Select Cohort A and Cohort B before running. This first version requires at least two samples per cohort and one sample per patient.
    default_prompt: Run limma-voom differential expression between Cohort A and Cohort B for the selected assay.
    execution_mode: deterministic
    default_compare_mode: true
    supports_compare_mode: true
    requires_detailed_access: true
    requires_assays: true
    required_modalities: [transcriptomics]
    required_data_types: [rsem_expected_counts]
    analysis_level: sample
    tags: [transcriptomics, differential-expression, limma, voom, rscript]

  - id: methylation-qc-pca
    name: Methylation QC and PCA
    category: Assays
    kind: methylation_qc_pca
    execution_backend: job
    expected_runtime: long
    job_timeout_seconds: 3600
    runner_type: rscript
    runner_ref: methylation_qc_pca
    description: Run matrix-level quality checks and principal component analysis on one externally stored processed M-value assay without loading all probe values into DuckDB.
    guidance: Select one methylation M-value assay. This analysis checks the supplied processed matrix and sample linkage; it does not repeat raw-array preprocessing from IDAT files.
    default_prompt: Run methylation QC and PCA for the selected assay in the current Analysis scope.
    execution_mode: deterministic
    requires_detailed_access: true
    requires_assays: true
    required_modalities: [methylation]
    required_data_types: [m_values]
    analysis_level: sample
    tags: [methylation, quality-control, pca, m-values, background, rscript]

  - id: methylation-limma-differential-methylation
    name: limma differential methylation
    category: Assays
    kind: differential_methylation
    execution_backend: job
    expected_runtime: long
    job_timeout_seconds: 7200
    runner_type: rscript
    runner_ref: methylation_limma_differential_methylation
    description: Run curated limma differential methylation on processed M-values between Cohort A and Cohort B without importing the complete probe matrix into DuckDB.
    guidance: Select Cohort A and Cohort B plus one methylation M-value assay. This first version requires at least two samples per cohort and one sample per patient.
    default_prompt: Run limma differential methylation between Cohort A and Cohort B for the selected assay.
    execution_mode: deterministic
    default_compare_mode: true
    supports_compare_mode: true
    minimum_samples_per_cohort: 2
    requires_detailed_access: true
    requires_assays: true
    required_modalities: [methylation]
    required_data_types: [m_values]
    analysis_level: sample
    tags: [methylation, differential-methylation, limma, m-values, background, rscript]

  - id: flow-cytometry-wilcoxon-cohort-comparison
    name: Immune-cell Wilcoxon cohort comparison
    category: Assays
    kind: quantitative_assay_comparison
    execution_backend: job
    expected_runtime: short
    job_timeout_seconds: 1800
    runner_type: rscript
    runner_ref: quantitative_assay_wilcoxon_comparison
    description: Compare every immune-cell population between Cohort A and Cohort B with unadjusted exploratory Wilcoxon rank-sum tests and BH correction.
    guidance: Select two disjoint saved cohorts and one compatible immune-cell abundance assay. At least three linked samples are required per cohort; measurements are tested on their supplied scale without covariate adjustment.
    default_prompt: Run an exploratory Wilcoxon cohort comparison of the selected immune-cell abundance assay between Cohort A and Cohort B.
    execution_mode: deterministic
    default_compare_mode: true
    supports_compare_mode: true
    minimum_samples_per_cohort: 3
    requires_detailed_access: true
    requires_assays: true
    requires_single_dataset_workspace: true
    required_modalities: [flow_cytometry]
    required_data_types: [cell_population_abundance]
    analysis_level: sample
    tags: [flow-cytometry, immune-cell, wilcoxon, cohort-comparison, exploratory, background, rscript]

  - id: serology-wilcoxon-cohort-comparison
    name: Serology Wilcoxon cohort comparison
    category: Assays
    kind: quantitative_assay_comparison
    execution_backend: job
    expected_runtime: short
    job_timeout_seconds: 1800
    runner_type: rscript
    runner_ref: quantitative_assay_wilcoxon_comparison
    description: Compare every quantitative serology marker between Cohort A and Cohort B with unadjusted exploratory Wilcoxon rank-sum tests and BH correction.
    guidance: Select two disjoint saved cohorts and one compatible quantitative-serology assay. At least three linked samples are required per cohort; measurements are tested on their supplied scale without covariate adjustment.
    default_prompt: Run an exploratory Wilcoxon cohort comparison of the selected quantitative serology assay between Cohort A and Cohort B.
    execution_mode: deterministic
    default_compare_mode: true
    supports_compare_mode: true
    minimum_samples_per_cohort: 3
    requires_detailed_access: true
    requires_assays: true
    requires_single_dataset_workspace: true
    required_modalities: [serology]
    required_data_types: [quantitative_measurement]
    analysis_level: sample
    tags: [serology, quantitative, wilcoxon, cohort-comparison, exploratory, background, rscript]

  - id: transcriptomics-hallmark-pathway-enrichment
    name: Hallmark pathway enrichment
    category: Assays
    kind: pathway_enrichment
    execution_backend: job
    expected_runtime: long
    job_timeout_seconds: 3600
    runner_type: rscript
    runner_ref: transcriptomics_hallmark_pathway_enrichment
    description: Run curated Hallmark pathway enrichment from a DESeq2-ranked comparison between Cohort A and Cohort B on one selected raw-count assay.
    guidance: Select Cohort A and Cohort B before running. This first version requires at least two samples per cohort and one sample per patient, so baseline-only or one-sample-per-patient inputs are preferred.
    default_prompt: Run Hallmark pathway enrichment between Cohort A and Cohort B for the selected assay.
    execution_mode: deterministic
    default_compare_mode: true
    supports_compare_mode: true
    requires_detailed_access: true
    requires_assays: true
    required_modalities: [transcriptomics]
    required_data_types: [raw_counts]
    analysis_level: sample
    tags: [transcriptomics, pathway-enrichment, hallmark, fgsea, background, rscript]

  - id: transcriptomics-signature-workflow
    name: Transcriptomics signature workflow
    category: Assays
    kind: workflow
    execution_backend: job
    expected_runtime: long
    job_timeout_seconds: 7200
    runner_type: workflow
    runner_ref: transcriptomics_signature
    description: "Run a curated two-step transcriptomics workflow: DESeq2 differential expression followed by Hallmark pathway enrichment for Cohort A versus Cohort B."
    guidance: "Select Cohort A and Cohort B plus one raw-count assay. This workflow runs both project-approved steps as one background job and returns one combined result."
    default_prompt: Run the transcriptomics signature workflow between Cohort A and Cohort B for the selected assay.
    execution_mode: deterministic
    default_compare_mode: true
    supports_compare_mode: true
    requires_detailed_access: true
    requires_assays: true
    required_modalities: [transcriptomics]
    required_data_types: [raw_counts]
    analysis_level: sample
    steps:
      - transcriptomics-deseq2-differential-expression
      - transcriptomics-hallmark-pathway-enrichment
    tags: [transcriptomics, workflow, signature, deseq2, hallmark, fgsea, background]

  - id: external-r-scope-snapshot
    name: External R cohort snapshot
    category: External
    kind: external_rscript
    debug_only: true
    execution_backend: sync
    runner_type: rscript
    runner_ref: dummy_scope_snapshot
    description: Run a curated external Rscript over the active Analysis scope to prove external execution wiring.
    guidance: Demonstration runner only. It reports workspace and scope counts through an external Rscript.
    default_prompt: Run the external R cohort snapshot analysis for the current Analysis scope.
    execution_mode: deterministic
    requires_detailed_access: true
    tags: [external, rscript, demo]

  - id: external-r-clinical-profile
    name: External R clinical scope profile
    category: External
    kind: external_rscript
    execution_backend: job
    expected_runtime: medium
    job_timeout_seconds: 1800
    runner_type: rscript
    runner_ref: clinical_scope_profile
    description: Build a scoped clinical profile in Python, hand it to a curated Rscript, and return a real external summary of diseases, medications, and active periods.
    guidance: Uses the current Analysis scope and works best when the scope contains recognizable disease and treatment labels.
    default_prompt: Run the external R clinical scope profile for the current Analysis scope.
    execution_mode: deterministic
    requires_detailed_access: true
    tags: [external, rscript, clinical]

  - id: external-r-long-job-demo
    name: External R long-running demo
    category: External
    kind: external_rscript
    debug_only: true
    execution_backend: job
    expected_runtime: long
    job_timeout_seconds: 1800
    runner_type: rscript
    runner_ref: dummy_long_job
    description: Curated background R job that intentionally sleeps before returning a reply, useful to validate queue behavior and the shared Jobs drawer.
    guidance: Demonstration runner only. It simulates a long-running external analysis by sleeping for 60 seconds before returning.
    default_prompt: Run the external long-running R demo for the current Analysis scope.
    execution_mode: deterministic
    requires_detailed_access: true
    tags: [external, rscript, demo, background]

  - id: external-snakemake-demo
    name: External Snakemake demo
    category: External
    kind: external_workflow
    debug_only: true
    execution_backend: job
    expected_runtime: medium
    job_timeout_seconds: 1800
    runner_type: snakemake
    runner_ref: dummy_queue_demo
    description: Curated background Snakemake workflow that writes a small structured result bundle for the current Analysis scope.
    guidance: Demonstration workflow only. It validates queued Snakemake execution and artifact handling.
    default_prompt: Run the external Snakemake demo for the current Analysis scope.
    execution_mode: deterministic
    requires_detailed_access: true
    tags: [external, snakemake, demo, background]

  - id: external-nextflow-demo
    name: External Nextflow demo
    category: External
    kind: external_workflow
    debug_only: true
    execution_backend: job
    expected_runtime: short
    job_timeout_seconds: 1800
    runner_type: nextflow
    runner_ref: dummy_queue_demo
    description: Curated background Nextflow workflow that writes a small structured result bundle for the current Analysis scope.
    guidance: Demonstration workflow only. It validates queued Nextflow execution and artifact handling.
    default_prompt: Run the external Nextflow demo for the current Analysis scope.
    execution_mode: deterministic
    requires_detailed_access: true
    tags: [external, nextflow, demo, background]
