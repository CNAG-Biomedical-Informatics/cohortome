<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Governed AI workflow in COHORTome</title>
  <desc id="desc">A user request is scoped to an authorized workspace, routed through deterministic or approved language model paths, validated, executed, and recorded as an auditable research result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#5f7482"/>
    </marker>
  </defs>

  <rect width="1440" height="560" fill="#f7f8f7"/>
  <text x="42" y="48" fill="#4f6269" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">COHORTome CAN WORK WITH OR WITHOUT A LANGUAGE MODEL</text>

  <rect x="42" y="78" width="218" height="116" rx="6" fill="#ffffff" stroke="#aab9bf" stroke-width="2"/>
  <text x="64" y="114" fill="#1b2c33" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Research request</text>
  <text x="64" y="144" fill="#536970" font-family="Inter, Arial, sans-serif" font-size="14">Question, cohort, or</text>
  <text x="64" y="168" fill="#536970" font-family="Inter, Arial, sans-serif" font-size="14">analysis objective</text>

  <line x1="260" y1="136" x2="304" y2="136" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="304" y="78" width="242" height="116" rx="6" fill="#eef5f7" stroke="#9bb7c0" stroke-width="2"/>
  <text x="326" y="114" fill="#1b2c33" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Check access first</text>
  <text x="326" y="144" fill="#536970" font-family="Inter, Arial, sans-serif" font-size="14">Which data may this user use?</text>
  <text x="326" y="168" fill="#536970" font-family="Inter, Arial, sans-serif" font-size="14">What may be shared with a model?</text>

  <line x1="425" y1="194" x2="425" y2="238" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="244" width="394" height="142" rx="6" fill="#edf6ee" stroke="#8fbb97" stroke-width="2"/>
  <text x="124" y="278" fill="#24502d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">WITHOUT A MODEL</text>
  <text x="124" y="312" fill="#1b2c33" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Known question or method</text>
  <text x="124" y="342" fill="#526b58" font-family="Inter, Arial, sans-serif" font-size="14">COHORTome can answer supported questions</text>
  <text x="124" y="366" fill="#526b58" font-family="Inter, Arial, sans-serif" font-size="14">and run reviewed methods directly.</text>

  <rect x="548" y="244" width="394" height="142" rx="6" fill="#fff6e2" stroke="#d1ad56" stroke-width="2"/>
  <text x="572" y="278" fill="#6a4b0b" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">WITH A LANGUAGE MODEL</text>
  <text x="572" y="312" fill="#332a19" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Use an approved model</text>
  <text x="572" y="342" fill="#6b5b38" font-family="Inter, Arial, sans-serif" font-size="14">COHORTome limits the information sent and</text>
  <text x="572" y="366" fill="#6b5b38" font-family="Inter, Arial, sans-serif" font-size="14">can block the request when needed.</text>

  <line x1="546" y1="136" x2="744" y2="136" stroke="#5f7482" stroke-width="2"/>
  <line x1="744" y1="136" x2="744" y2="238" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="494" y1="315" x2="1010" y2="315" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="942" y1="315" x2="1010" y2="315" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1010" y="244" width="388" height="142" rx="6" fill="#f2f5f7" stroke="#aab9bf" stroke-width="2"/>
  <text x="1034" y="278" fill="#41565e" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">CHECK + RUN</text>
  <text x="1034" y="312" fill="#1b2c33" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">COHORTome runs the operation</text>
  <text x="1034" y="342" fill="#536970" font-family="Inter, Arial, sans-serif" font-size="14">COHORTome checks the proposed action first.</text>
  <text x="1034" y="366" fill="#536970" font-family="Inter, Arial, sans-serif" font-size="14">The model cannot run unrestricted commands.</text>

  <line x1="1204" y1="386" x2="1204" y2="426" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="548" y="432" width="850" height="94" rx="6" fill="#0e6964"/>
  <text x="574" y="468" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Result with its history</text>
  <text x="574" y="498" fill="#d5f2ee" font-family="Inter, Arial, sans-serif" font-size="14">Selected data, route, model, settings, software, outputs, and limitations remain attached.</text>

  <line x1="297" y1="386" x2="297" y2="479" stroke="#5f7482" stroke-width="2"/>
  <line x1="297" y1="479" x2="542" y2="479" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="42" y="534" fill="#536970" font-family="Inter, Arial, sans-serif" font-size="14">A language model may help plan or explain. It does not decide access, run arbitrary code, or prove that a result is scientifically valid.</text>
</svg>
