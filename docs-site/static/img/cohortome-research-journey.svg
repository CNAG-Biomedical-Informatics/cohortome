<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">A research journey through COHORTome</title>
  <desc id="desc">Approved clinical, assay, and imaging data enter COHORTome. COHORTome links patients, samples, and visits, helps a researcher find a cohort, runs a reviewed analysis, and keeps the result with its history.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17313a" flood-opacity=".12"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#177d75"/>
    </marker>
    <marker id="historyArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b25c25"/>
    </marker>
  </defs>

  <rect width="1440" height="720" fill="#f3f6f6"/>
  <rect y="628" width="1440" height="92" fill="#dfe8e8"/>
  <path d="M0 628H1440" stroke="#bdcccc" stroke-width="2"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="42" y="38" fill="#177d75" font-size="13" font-weight="800">A COHORTome RESEARCH JOURNEY</text>
    <text x="42" y="76" fill="#172a32" font-size="30" font-weight="800">From approved data to a result you can trace</text>
    <text x="42" y="104" fill="#566b73" font-size="15">The source systems keep the original data. COHORTome keeps the research work connected.</text>

    <!-- Approved sources -->
    <g filter="url(#shadow)">
      <rect x="42" y="134" width="286" height="458" rx="8" fill="#ffffff" stroke="#9fb2b8" stroke-width="2"/>
    </g>
    <rect x="42" y="134" width="8" height="458" rx="4" fill="#315f82"/>
    <text x="66" y="166" fill="#315f82" font-size="13" font-weight="800">1  APPROVED DATA ARRIVE</text>

    <rect x="66" y="188" width="238" height="92" rx="6" fill="#f0f6fa" stroke="#8aafc6"/>
    <g transform="translate(82 207)">
      <ellipse cx="23" cy="7" rx="22" ry="7" fill="#d8e8f1" stroke="#315f82" stroke-width="2"/>
      <path d="M1 7v31c0 4 10 7 22 7s22-3 22-7V7M1 22c0 4 10 7 22 7s22-3 22-7" fill="#eaf3f8" stroke="#315f82" stroke-width="2"/>
    </g>
    <text x="140" y="215" fill="#203d4e" font-size="16" font-weight="700">Data warehouse</text>
    <text x="140" y="238" fill="#597079" font-size="12">3TR example: Omics DM</text>
    <rect x="140" y="248" width="116" height="20" rx="4" fill="#dceaf2"/>
    <text x="198" y="262" fill="#315f82" font-size="10" font-weight="800" text-anchor="middle">STUDY DATA</text>

    <rect x="66" y="296" width="238" height="84" rx="6" fill="#f4faf5" stroke="#8fbb97"/>
    <rect x="84" y="311" width="40" height="52" rx="3" fill="#ffffff" stroke="#2f7d4e" stroke-width="2"/>
    <path d="M93 326h22M93 335h18M93 344h22M93 353h14" stroke="#79a987" stroke-width="2"/>
    <text x="142" y="326" fill="#24502d" font-size="16" font-weight="700">Clinical records</text>
    <text x="142" y="349" fill="#597079" font-size="12">Visits &#183; diagnoses &#183; treatment</text>
    <text x="142" y="367" fill="#597079" font-size="12">outcomes &#183; measurements</text>

    <rect x="66" y="396" width="238" height="84" rx="6" fill="#fff7e8" stroke="#d2ad5c"/>
    <g transform="translate(82 413)">
      <rect width="44" height="44" rx="3" fill="#ffffff" stroke="#b97920" stroke-width="2"/>
      <g fill="#e5ba69">
        <rect x="6" y="6" width="7" height="7"/><rect x="16" y="6" width="7" height="7"/><rect x="26" y="6" width="12" height="7"/>
        <rect x="6" y="16" width="17" height="7"/><rect x="26" y="16" width="12" height="7"/>
        <rect x="6" y="26" width="7" height="12"/><rect x="16" y="26" width="22" height="12"/>
      </g>
    </g>
    <text x="142" y="426" fill="#684612" font-size="16" font-weight="700">Assay measurements</text>
    <text x="142" y="449" fill="#6f624d" font-size="12">RNA &#183; proteins &#183; variants</text>
    <text x="142" y="467" fill="#6f624d" font-size="12">derived imaging features</text>

    <rect x="66" y="496" width="238" height="72" rx="6" fill="#f7f3fa" stroke="#a58bb2"/>
    <rect x="82" y="508" width="52" height="48" rx="3" fill="#171b20" stroke="#6f587b" stroke-width="2"/>
    <ellipse cx="108" cy="532" rx="16" ry="19" fill="#c7c9ca"/>
    <path d="M98 525c5-9 15-10 21-2M97 538c6 7 16 8 23 1M108 515v34" fill="none" stroke="#777b7e" stroke-width="2"/>
    <circle cx="101" cy="531" r="2" fill="#f1f2f2"/><circle cx="116" cy="535" r="2" fill="#f1f2f2"/>
    <text x="148" y="523" fill="#5b3f69" font-size="16" font-weight="700">Image archive</text>
    <text x="148" y="546" fill="#6b6170" font-size="12">DICOMweb keeps pixels</text>

    <!-- Flow to linked workspace -->
    <path d="M328 356H366" fill="none" stroke="#177d75" stroke-width="3" marker-end="url(#flowArrow)"/>

    <!-- Linked patient workspace -->
    <g filter="url(#shadow)">
      <rect x="370" y="134" width="390" height="458" rx="8" fill="#ffffff" stroke="#5d9f98" stroke-width="2"/>
    </g>
    <rect x="370" y="134" width="390" height="54" rx="8" fill="#0e6964"/>
    <rect x="370" y="180" width="390" height="8" fill="#0e6964"/>
    <text x="394" y="167" fill="#ffffff" font-size="13" font-weight="800">2  COHORTome CONNECTS THE RECORDS</text>

    <rect x="394" y="210" width="342" height="68" rx="6" fill="#eef6f5" stroke="#9bc9c4"/>
    <g transform="translate(412 226)">
      <circle cx="11" cy="8" r="6" fill="#177d75"/>
      <path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke="#177d75" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="452" y="236" fill="#193c3a" font-size="16" font-weight="700">Patient SYN011</text>
    <text x="452" y="258" fill="#58706e" font-size="12">Multiple sclerosis &#183; 5 visits &#183; 4 data types</text>
    <rect x="650" y="225" width="68" height="26" rx="4" fill="#d6eee9"/>
    <text x="684" y="243" fill="#0e6964" font-size="11" font-weight="800" text-anchor="middle">ALLOWED</text>

    <text x="394" y="314" fill="#536970" font-size="11" font-weight="800">PATIENT TIMELINE</text>
    <path d="M420 358H704" stroke="#7b9096" stroke-width="3"/>
    <g>
      <circle cx="438" cy="358" r="10" fill="#315f82" stroke="#ffffff" stroke-width="3"/>
      <circle cx="522" cy="358" r="10" fill="#2f7d4e" stroke="#ffffff" stroke-width="3"/>
      <circle cx="606" cy="358" r="10" fill="#b97920" stroke="#ffffff" stroke-width="3"/>
      <circle cx="690" cy="358" r="10" fill="#7b4f8f" stroke="#ffffff" stroke-width="3"/>
    </g>
    <text x="438" y="390" fill="#536970" font-size="11" text-anchor="middle">week 0</text>
    <text x="522" y="390" fill="#536970" font-size="11" text-anchor="middle">week 6</text>
    <text x="606" y="390" fill="#536970" font-size="11" text-anchor="middle">week 14</text>
    <text x="690" y="390" fill="#536970" font-size="11" text-anchor="middle">week 26</text>

    <path d="M438 348V326H690" fill="none" stroke="#315f82" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="564" y="322" fill="#315f82" font-size="10" text-anchor="middle">clinical events</text>
    <g transform="translate(427 410) scale(.72)">
      <path d="M4 2h14M7 2v7l-3 9a6 6 0 0 0 6 8h2a6 6 0 0 0 6-8l-3-9V2" fill="#ffffff" stroke="#b97920" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 18h10" stroke="#b97920" stroke-width="5" opacity=".58"/>
    </g>
    <g transform="translate(511 410) scale(.72)">
      <path d="M4 2h14M7 2v7l-3 9a6 6 0 0 0 6 8h2a6 6 0 0 0 6-8l-3-9V2" fill="#ffffff" stroke="#b97920" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 18h10" stroke="#b97920" stroke-width="5" opacity=".58"/>
    </g>
    <g transform="translate(595 410) scale(.72)">
      <path d="M4 2h14M7 2v7l-3 9a6 6 0 0 0 6 8h2a6 6 0 0 0 6-8l-3-9V2" fill="#ffffff" stroke="#b97920" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 18h10" stroke="#b97920" stroke-width="5" opacity=".58"/>
    </g>
    <text x="690" y="432" fill="#b13a43" font-size="12" font-weight="700" text-anchor="middle">missing</text>
    <text x="564" y="456" fill="#6f624d" font-size="10" text-anchor="middle">assay samples linked to the correct visit</text>

    <rect x="394" y="478" width="104" height="82" rx="6" fill="#f0f6fa" stroke="#8aafc6"/>
    <text x="446" y="501" fill="#315f82" font-size="11" font-weight="800" text-anchor="middle">PATIENT</text>
    <text x="446" y="526" fill="#172a32" font-size="20" font-weight="800" text-anchor="middle">1</text>
    <text x="446" y="547" fill="#60747d" font-size="10" text-anchor="middle">person</text>
    <rect x="512" y="478" width="104" height="82" rx="6" fill="#fff7e8" stroke="#d2ad5c"/>
    <text x="564" y="501" fill="#9a6518" font-size="11" font-weight="800" text-anchor="middle">SAMPLES</text>
    <text x="564" y="526" fill="#172a32" font-size="20" font-weight="800" text-anchor="middle">3</text>
    <text x="564" y="547" fill="#60747d" font-size="10" text-anchor="middle">collected visits</text>
    <rect x="630" y="478" width="106" height="82" rx="6" fill="#f7f3fa" stroke="#a58bb2"/>
    <text x="683" y="501" fill="#6f4d7e" font-size="11" font-weight="800" text-anchor="middle">IMAGE STUDY</text>
    <text x="683" y="526" fill="#172a32" font-size="20" font-weight="800" text-anchor="middle">1</text>
    <text x="683" y="547" fill="#60747d" font-size="10" text-anchor="middle">linked DICOM</text>

    <!-- Cohort funnel -->
    <path d="M760 356H794" fill="none" stroke="#177d75" stroke-width="3" marker-end="url(#flowArrow)"/>
    <g filter="url(#shadow)">
      <rect x="798" y="134" width="226" height="458" rx="8" fill="#ffffff" stroke="#b59a65" stroke-width="2"/>
    </g>
    <rect x="798" y="134" width="8" height="458" rx="4" fill="#b97920"/>
    <text x="822" y="166" fill="#8a5916" font-size="13" font-weight="800">3  FIND A COHORT</text>
    <rect x="822" y="190" width="178" height="82" rx="6" fill="#fff7e8" stroke="#d2ad5c"/>
    <text x="838" y="216" fill="#6b4819" font-size="12" font-weight="700">Research question</text>
    <text x="838" y="240" fill="#4e4030" font-size="12">MS patients with baseline MRI</text>
    <text x="838" y="258" fill="#4e4030" font-size="12">and transcriptomics</text>

    <text x="822" y="302" fill="#536970" font-size="10" font-weight="800">38 PATIENTS IN WORKSPACE</text>
    <g fill="#8aa0a6" stroke="#8aa0a6" stroke-linecap="round">
      <g transform="translate(830 318) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(868 318) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(906 318) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(944 318) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(830 352) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(868 352) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(906 352) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(944 352) scale(.72)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
    </g>
    <path d="M838 402H984L956 454H866Z" fill="#f4ead7" stroke="#b97920" stroke-width="2"/>
    <text x="911" y="427" fill="#8a5916" font-size="11" font-weight="800" text-anchor="middle">CHECK CRITERIA</text>
    <text x="911" y="446" fill="#6f624d" font-size="10" text-anchor="middle">with or without a model</text>
    <path d="M911 454V478" stroke="#b97920" stroke-width="2" marker-end="url(#historyArrow)"/>
    <g fill="#2f7d4e" stroke="#2f7d4e" stroke-linecap="round">
      <g transform="translate(850 488) scale(.82)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(896 488) scale(.82)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
      <g transform="translate(942 488) scale(.82)"><circle cx="11" cy="8" r="6"/><path d="M2 27c0-7 4-11 9-11s9 4 9 11" fill="none" stroke-width="4"/></g>
    </g>
    <text x="911" y="548" fill="#24502d" font-size="14" font-weight="800" text-anchor="middle">8 matched patients</text>
    <text x="911" y="569" fill="#60747d" font-size="10" text-anchor="middle">patient + sample IDs saved</text>

    <!-- Analysis and result -->
    <path d="M1024 356H1058" fill="none" stroke="#177d75" stroke-width="3" marker-end="url(#flowArrow)"/>
    <g filter="url(#shadow)">
      <rect x="1062" y="134" width="336" height="458" rx="8" fill="#ffffff" stroke="#8f9fac" stroke-width="2"/>
    </g>
    <rect x="1062" y="134" width="336" height="54" rx="8" fill="#263b46"/>
    <rect x="1062" y="180" width="336" height="8" fill="#263b46"/>
    <circle cx="1084" cy="161" r="5" fill="#c74c52"/><circle cx="1100" cy="161" r="5" fill="#d8a231"/><circle cx="1116" cy="161" r="5" fill="#46a05e"/>
    <text x="1134" y="166" fill="#ffffff" font-size="13" font-weight="800">4  RUN + KEEP THE ANALYSIS</text>

    <rect x="1086" y="210" width="288" height="174" rx="6" fill="#f5f8f9" stroke="#b8c7cc"/>
    <text x="1104" y="236" fill="#536970" font-size="11" font-weight="800">DERIVED IMAGING FEATURE VS EXPRESSION SCORE</text>
    <path d="M1110 352V254M1110 352H1350" stroke="#78909a" stroke-width="1.5"/>
    <path d="M1126 333C1160 320 1184 326 1216 297S1282 276 1338 248" fill="none" stroke="#315f82" stroke-width="3"/>
    <g fill="#0e9bad" stroke="#ffffff" stroke-width="2">
      <circle cx="1134" cy="330" r="6"/><circle cx="1172" cy="315" r="6"/><circle cx="1218" cy="296" r="6"/>
      <circle cx="1260" cy="286" r="6"/><circle cx="1300" cy="264" r="6"/><circle cx="1338" cy="249" r="6"/>
    </g>
    <text x="1230" y="374" fill="#60747d" font-size="10" text-anchor="middle">illustrative result &#183; not a biological claim</text>

    <rect x="1086" y="402" width="136" height="70" rx="6" fill="#eef6f5" stroke="#9bc9c4"/>
    <path d="M1104 421h18v27h-18zM1108 426h10M1108 433h10M1108 440h7" fill="none" stroke="#0e6964" stroke-width="2"/>
    <text x="1132" y="426" fill="#193c3a" font-size="11" font-weight="800">METHOD</text>
    <text x="1132" y="447" fill="#58706e" font-size="10">settings + version</text>
    <text x="1132" y="462" fill="#58706e" font-size="10">scope + cohort</text>
    <rect x="1238" y="402" width="136" height="70" rx="6" fill="#fff7e8" stroke="#d2ad5c"/>
    <path d="M1256 421h18v27h-18zM1260 426h10M1260 433h10M1260 440h7" fill="none" stroke="#b97920" stroke-width="2"/>
    <text x="1284" y="426" fill="#684612" font-size="11" font-weight="800">OUTPUTS</text>
    <text x="1284" y="447" fill="#6f624d" font-size="10">plot + table</text>
    <text x="1284" y="462" fill="#6f624d" font-size="10">log + files</text>

    <rect x="1086" y="490" width="288" height="70" rx="6" fill="#edf6ee" stroke="#8fbb97"/>
    <circle cx="1111" cy="525" r="15" fill="#2f7d4e"/>
    <path d="M1104 525l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1138" y="518" fill="#24502d" font-size="14" font-weight="800">Result saved with its history</text>
    <text x="1138" y="541" fill="#526b58" font-size="11">ready to review, share, or repeat</text>

    <!-- Feedback loop -->
    <path d="M1374 490H1410V116H920V184" fill="none" stroke="#b25c25" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#historyArrow)"/>
    <rect x="1024" y="105" width="272" height="21" fill="#f3f6f6"/>
    <text x="1160" y="126" fill="#9a4c1d" font-size="10" font-weight="800" text-anchor="middle">RESULTS CAN INFORM THE NEXT QUESTION</text>

    <!-- Four-beat footer -->
    <path d="M42 664H1398" stroke="#bdcccc"/>
    <circle cx="66" cy="687" r="14" fill="#315f82"/><text x="66" y="692" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">1</text>
    <text x="90" y="692" fill="#314c57" font-size="13" font-weight="700">Receive approved data</text>
    <circle cx="370" cy="687" r="14" fill="#0e6964"/><text x="370" y="692" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">2</text>
    <text x="394" y="692" fill="#314c57" font-size="13" font-weight="700">Connect patients, samples, and visits</text>
    <circle cx="806" cy="687" r="14" fill="#b97920"/><text x="806" y="692" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">3</text>
    <text x="830" y="692" fill="#314c57" font-size="13" font-weight="700">Find and save a cohort</text>
    <circle cx="1116" cy="687" r="14" fill="#2f7d4e"/><text x="1116" y="692" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">4</text>
    <text x="1140" y="692" fill="#314c57" font-size="13" font-weight="700">Run, review, and keep the result</text>
  </g>
</svg>
