<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="1500" viewBox="0 0 680 1500" role="img" aria-labelledby="title desc">
  <title id="title">A research journey through COHORTome</title>
  <desc id="desc">Approved clinical, assay, and imaging data enter COHORTome. COHORTome links patients, samples, and visits, helps a researcher find a cohort, runs a reviewed analysis, and keeps the result with its history.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17313a" flood-opacity=".12"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#177d75"/>
    </marker>
    <marker id="historyArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b25c25"/>
    </marker>
  </defs>

  <rect width="680" height="1500" fill="#f3f6f6"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="30" y="39" fill="#177d75" font-size="16" font-weight="800">A COHORTome RESEARCH JOURNEY</text>
    <text x="30" y="77" fill="#172a32" font-size="29" font-weight="800">From approved data to a result</text>
    <text x="30" y="108" fill="#172a32" font-size="29" font-weight="800">you can trace</text>
    <text x="30" y="137" fill="#566b73" font-size="16">COHORTome keeps the research steps connected.</text>

    <!-- Stage 1: approved sources -->
    <g filter="url(#shadow)">
      <rect x="30" y="170" width="620" height="258" rx="8" fill="#ffffff" stroke="#9fb2b8" stroke-width="2"/>
    </g>
    <rect x="30" y="170" width="8" height="258" rx="4" fill="#315f82"/>
    <text x="58" y="204" fill="#315f82" font-size="16" font-weight="800">1  APPROVED DATA ARRIVE</text>

    <rect x="58" y="225" width="270" height="82" rx="6" fill="#f0f6fa" stroke="#8aafc6"/>
    <g transform="translate(75 242)">
      <ellipse cx="21" cy="6" rx="20" ry="6" fill="#d8e8f1" stroke="#315f82" stroke-width="2"/>
      <path d="M1 6v32c0 4 9 6 20 6s20-2 20-6V6M1 22c0 4 9 6 20 6s20-2 20-6" fill="#eaf3f8" stroke="#315f82" stroke-width="2"/>
    </g>
    <text x="131" y="250" fill="#203d4e" font-size="17" font-weight="700">Data warehouse</text>
    <text x="131" y="273" fill="#597079" font-size="13">3TR example: Omics DM</text>
    <text x="131" y="292" fill="#315f82" font-size="12" font-weight="800">PRECISESADS</text>

    <rect x="352" y="225" width="270" height="82" rx="6" fill="#f4faf5" stroke="#8fbb97"/>
    <rect x="370" y="239" width="42" height="53" rx="3" fill="#ffffff" stroke="#2f7d4e" stroke-width="2"/>
    <path d="M379 253h24M379 262h20M379 271h24M379 280h15" stroke="#79a987" stroke-width="2"/>
    <text x="430" y="252" fill="#24502d" font-size="17" font-weight="700">Clinical records</text>
    <text x="430" y="276" fill="#597079" font-size="13">Visits, diagnoses,</text>
    <text x="430" y="294" fill="#597079" font-size="13">treatment, outcomes</text>

    <rect x="58" y="327" width="270" height="76" rx="6" fill="#fff7e8" stroke="#d2ad5c"/>
    <g transform="translate(76 343)">
      <rect width="44" height="44" rx="3" fill="#ffffff" stroke="#b97920" stroke-width="2"/>
      <g fill="#e5ba69">
        <rect x="6" y="6" width="7" height="7"/><rect x="16" y="6" width="7" height="7"/><rect x="26" y="6" width="12" height="7"/>
        <rect x="6" y="16" width="17" height="7"/><rect x="26" y="16" width="12" height="7"/>
        <rect x="6" y="26" width="7" height="12"/><rect x="16" y="26" width="22" height="12"/>
      </g>
    </g>
    <text x="135" y="354" fill="#684612" font-size="17" font-weight="700">Assays</text>
    <text x="135" y="379" fill="#6f624d" font-size="13">RNA, proteins, variants</text>

    <rect x="352" y="327" width="270" height="76" rx="6" fill="#f7f3fa" stroke="#a58bb2"/>
    <rect x="370" y="341" width="54" height="48" rx="3" fill="#171b20" stroke="#6f587b" stroke-width="2"/>
    <ellipse cx="397" cy="365" rx="16" ry="19" fill="#c7c9ca"/>
    <path d="M387 358c5-9 15-10 21-2M386 371c6 7 16 8 23 1M397 348v34" fill="none" stroke="#777b7e" stroke-width="2"/>
    <text x="442" y="354" fill="#5b3f69" font-size="17" font-weight="700">Image archive</text>
    <text x="442" y="379" fill="#6b6170" font-size="13">DICOMweb keeps pixels</text>

    <path d="M340 428V463" fill="none" stroke="#177d75" stroke-width="3" marker-end="url(#flowArrow)"/>
    <rect x="262" y="435" width="156" height="24" rx="4" fill="#d6eee9"/>
    <text x="340" y="452" fill="#0e6964" font-size="11" font-weight="800" text-anchor="middle">AUTHORIZED RELEASE</text>

    <!-- Stage 2: linked patient workspace -->
    <g filter="url(#shadow)">
      <rect x="30" y="468" width="620" height="330" rx="8" fill="#ffffff" stroke="#5d9f98" stroke-width="2"/>
    </g>
    <rect x="30" y="468" width="620" height="56" rx="8" fill="#0e6964"/>
    <rect x="30" y="516" width="620" height="8" fill="#0e6964"/>
    <text x="58" y="502" fill="#ffffff" font-size="16" font-weight="800">2  COHORTome CONNECTS THE RECORDS</text>

    <rect x="58" y="545" width="564" height="62" rx="6" fill="#eef6f5" stroke="#9bc9c4"/>
    <g transform="translate(78 561)">
      <circle cx="12" cy="9" r="7" fill="#177d75"/>
      <path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke="#177d75" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="124" y="570" fill="#193c3a" font-size="17" font-weight="700">Patient SYN011</text>
    <text x="124" y="593" fill="#58706e" font-size="13">Multiple sclerosis &#183; 5 visits &#183; 4 data types</text>
    <rect x="526" y="561" width="76" height="27" rx="4" fill="#d6eee9"/>
    <text x="564" y="579" fill="#0e6964" font-size="11" font-weight="800" text-anchor="middle">ALLOWED</text>

    <text x="58" y="641" fill="#536970" font-size="12" font-weight="800">PATIENT TIMELINE</text>
    <path d="M88 684H592" stroke="#7b9096" stroke-width="3"/>
    <circle cx="104" cy="684" r="11" fill="#315f82" stroke="#ffffff" stroke-width="3"/>
    <circle cx="264" cy="684" r="11" fill="#2f7d4e" stroke="#ffffff" stroke-width="3"/>
    <circle cx="424" cy="684" r="11" fill="#b97920" stroke="#ffffff" stroke-width="3"/>
    <circle cx="576" cy="684" r="11" fill="#7b4f8f" stroke="#ffffff" stroke-width="3"/>
    <text x="104" y="716" fill="#536970" font-size="12" text-anchor="middle">week 0</text>
    <text x="264" y="716" fill="#536970" font-size="12" text-anchor="middle">week 6</text>
    <text x="424" y="716" fill="#536970" font-size="12" text-anchor="middle">week 14</text>
    <text x="576" y="716" fill="#536970" font-size="12" text-anchor="middle">week 26</text>
    <g transform="translate(91 733) scale(.72)">
      <path d="M4 2h16M8 2v8l-4 11a7 7 0 0 0 7 9h2a7 7 0 0 0 7-9l-4-11V2" fill="#ffffff" stroke="#b97920" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 21h12" stroke="#b97920" stroke-width="6" opacity=".58"/>
    </g>
    <g transform="translate(251 733) scale(.72)">
      <path d="M4 2h16M8 2v8l-4 11a7 7 0 0 0 7 9h2a7 7 0 0 0 7-9l-4-11V2" fill="#ffffff" stroke="#b97920" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 21h12" stroke="#b97920" stroke-width="6" opacity=".58"/>
    </g>
    <g transform="translate(411 733) scale(.72)">
      <path d="M4 2h16M8 2v8l-4 11a7 7 0 0 0 7 9h2a7 7 0 0 0 7-9l-4-11V2" fill="#ffffff" stroke="#b97920" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 21h12" stroke="#b97920" stroke-width="6" opacity=".58"/>
    </g>
    <text x="576" y="754" fill="#b13a43" font-size="13" font-weight="700" text-anchor="middle">missing</text>
    <text x="340" y="779" fill="#6f624d" font-size="11" text-anchor="middle">samples and images stay linked to the correct visit</text>

    <path d="M340 798V833" fill="none" stroke="#177d75" stroke-width="3" marker-end="url(#flowArrow)"/>

    <!-- Stage 3: cohort funnel -->
    <g filter="url(#shadow)">
      <rect x="30" y="838" width="620" height="272" rx="8" fill="#ffffff" stroke="#b59a65" stroke-width="2"/>
    </g>
    <rect x="30" y="838" width="8" height="272" rx="4" fill="#b97920"/>
    <text x="58" y="872" fill="#8a5916" font-size="16" font-weight="800">3  FIND AND SAVE A COHORT</text>
    <rect x="58" y="892" width="564" height="64" rx="6" fill="#fff7e8" stroke="#d2ad5c"/>
    <text x="78" y="918" fill="#6b4819" font-size="14" font-weight="700">Research question</text>
    <text x="78" y="941" fill="#4e4030" font-size="14">MS patients with baseline MRI and transcriptomics</text>

    <text x="58" y="987" fill="#536970" font-size="11" font-weight="800">38 PATIENTS IN WORKSPACE</text>
    <g fill="#8aa0a6" stroke="#8aa0a6" stroke-linecap="round">
      <g transform="translate(68 1000) scale(.7)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
      <g transform="translate(110 1000) scale(.7)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
      <g transform="translate(152 1000) scale(.7)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
      <g transform="translate(194 1000) scale(.7)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
      <g transform="translate(236 1000) scale(.7)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
      <g transform="translate(278 1000) scale(.7)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
    </g>
    <path d="M350 984H480L458 1028H372Z" fill="#f4ead7" stroke="#b97920" stroke-width="2"/>
    <text x="415" y="1005" fill="#8a5916" font-size="11" font-weight="800" text-anchor="middle">CHECK CRITERIA</text>
    <text x="415" y="1022" fill="#6f624d" font-size="10" text-anchor="middle">with or without a model</text>
    <path d="M480 1006H506" stroke="#b97920" stroke-width="2" marker-end="url(#historyArrow)"/>
    <g fill="#2f7d4e" stroke="#2f7d4e" stroke-linecap="round">
      <g transform="translate(523 988) scale(.76)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
      <g transform="translate(564 988) scale(.76)"><circle cx="12" cy="9" r="7"/><path d="M2 30c0-8 4-12 10-12s10 4 10 12" fill="none" stroke-width="5"/></g>
    </g>
    <text x="556" y="1054" fill="#24502d" font-size="15" font-weight="800" text-anchor="middle">8 matched</text>
    <text x="340" y="1085" fill="#60747d" font-size="12" text-anchor="middle">patient and sample identifiers are saved with the cohort</text>

    <path d="M340 1110V1145" fill="none" stroke="#177d75" stroke-width="3" marker-end="url(#flowArrow)"/>

    <!-- Stage 4: analysis and result -->
    <g filter="url(#shadow)">
      <rect x="30" y="1150" width="620" height="300" rx="8" fill="#ffffff" stroke="#8f9fac" stroke-width="2"/>
    </g>
    <rect x="30" y="1150" width="620" height="56" rx="8" fill="#263b46"/>
    <rect x="30" y="1198" width="620" height="8" fill="#263b46"/>
    <circle cx="56" cy="1178" r="5" fill="#c74c52"/><circle cx="72" cy="1178" r="5" fill="#d8a231"/><circle cx="88" cy="1178" r="5" fill="#46a05e"/>
    <text x="108" y="1184" fill="#ffffff" font-size="16" font-weight="800">4  RUN, REVIEW, AND KEEP THE RESULT</text>

    <rect x="58" y="1226" width="350" height="150" rx="6" fill="#f5f8f9" stroke="#b8c7cc"/>
    <text x="76" y="1251" fill="#536970" font-size="10" font-weight="800">IMAGING FEATURE VS EXPRESSION SCORE</text>
    <path d="M82 1344V1270M82 1344H384" stroke="#78909a" stroke-width="1.5"/>
    <path d="M98 1331C135 1324 164 1312 198 1304S263 1290 306 1268 351 1264 374 1257" fill="none" stroke="#315f82" stroke-width="3"/>
    <g fill="#0e9bad" stroke="#ffffff" stroke-width="2">
      <circle cx="108" cy="1327" r="6"/><circle cx="158" cy="1315" r="6"/><circle cx="210" cy="1301" r="6"/>
      <circle cx="264" cy="1288" r="6"/><circle cx="318" cy="1269" r="6"/><circle cx="370" cy="1258" r="6"/>
    </g>
    <text x="233" y="1363" fill="#60747d" font-size="10" text-anchor="middle">illustrative result &#183; not a biological claim</text>

    <rect x="428" y="1226" width="194" height="70" rx="6" fill="#eef6f5" stroke="#9bc9c4"/>
    <text x="448" y="1251" fill="#193c3a" font-size="12" font-weight="800">METHOD + SCOPE</text>
    <text x="448" y="1273" fill="#58706e" font-size="11">settings &#183; version &#183; cohort</text>
    <rect x="428" y="1306" width="194" height="70" rx="6" fill="#fff7e8" stroke="#d2ad5c"/>
    <text x="448" y="1331" fill="#684612" font-size="12" font-weight="800">OUTPUTS</text>
    <text x="448" y="1353" fill="#6f624d" font-size="11">plot &#183; table &#183; log &#183; files</text>

    <rect x="58" y="1393" width="564" height="36" rx="6" fill="#edf6ee" stroke="#8fbb97"/>
    <circle cx="80" cy="1411" r="12" fill="#2f7d4e"/>
    <path d="M74 1411l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="101" y="1417" fill="#24502d" font-size="14" font-weight="800">Result saved with its history</text>

    <!-- Return to the next question -->
    <path d="M622 1394H657V816H526V842" fill="none" stroke="#b25c25" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#historyArrow)"/>
    <text x="645" y="1117" fill="#9a4c1d" font-size="10" font-weight="800" text-anchor="middle" transform="rotate(-90 645 1117)">THE RESULT CAN INFORM THE NEXT QUESTION</text>

    <text x="340" y="1481" fill="#536970" font-size="13" font-weight="700" text-anchor="middle">Source data stay outside COHORTome &#183; research history stays attached</text>
  </g>
</svg>
