<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1180" viewBox="0 0 680 1180" role="img" aria-labelledby="title desc">
  <title id="title">COHORTome platform workflow</title>
  <desc id="desc">COHORTome receives released data, links records, checks access, and saves analysis results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#5f7482"/>
    </marker>
  </defs>
  <rect width="680" height="1180" fill="#f6f8fa"/>

  <rect x="36" y="30" width="608" height="202" rx="8" fill="#ffffff" stroke="#cbd5dc" stroke-width="2"/>
  <text x="62" y="66" fill="#526571" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">SOURCE SYSTEMS</text>
  <text x="62" y="98" fill="#1c2b33" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Independent inputs</text>
  <rect x="62" y="122" width="170" height="78" rx="6" fill="#f3f6f8" stroke="#b8c5cc"/>
  <text x="78" y="146" fill="#1c2b33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Data warehouse</text>
  <text x="78" y="170" fill="#526571" font-family="Inter, Arial, sans-serif" font-size="12">3TR Omics DM</text>
  <text x="78" y="190" fill="#526571" font-family="Inter, Arial, sans-serif" font-size="12">Authorized study data</text>
  <rect x="252" y="122" width="170" height="78" rx="6" fill="#f3f6f8" stroke="#b8c5cc"/>
  <text x="268" y="151" fill="#1c2b33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Other data</text>
  <text x="268" y="176" fill="#526571" font-family="Inter, Arial, sans-serif" font-size="13">Approved releases</text>
  <rect x="442" y="122" width="176" height="78" rx="6" fill="#f3f6f8" stroke="#b8c5cc"/>
  <text x="458" y="151" fill="#1c2b33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Image archives</text>
  <text x="458" y="176" fill="#526571" font-family="Inter, Arial, sans-serif" font-size="13">DICOMweb</text>

  <line x1="340" y1="232" x2="340" y2="270" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="36" y="276" width="608" height="850" rx="8" fill="#ffffff" stroke="#13847c" stroke-width="2"/>
  <rect x="36" y="276" width="608" height="62" rx="8" fill="#0e6964"/>
  <rect x="36" y="330" width="608" height="8" fill="#0e6964"/>
  <text x="62" y="314" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="19"><tspan font-weight="700">COHORT</tspan><tspan fill="#d5f2ee" font-weight="400">ome</tspan></text>

  <text x="62" y="380" fill="#0e6964" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">01  PREPARE THE DATA</text>
  <rect x="62" y="398" width="556" height="124" rx="6" fill="#edf8f6" stroke="#96cfc9"/>
  <text x="84" y="432" fill="#17343a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Organize and connect records</text>
  <text x="84" y="462" fill="#4f676d" font-family="Inter, Arial, sans-serif" font-size="14">Match names, units, patients, samples, visits, assays,</text>
  <text x="84" y="488" fill="#4f676d" font-family="Inter, Arial, sans-serif" font-size="14">images, and their original data sources.</text>

  <line x1="340" y1="522" x2="340" y2="560" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="62" y="594" fill="#0e6964" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">02  CONTROL ACCESS</text>
  <rect x="62" y="612" width="556" height="148" rx="6" fill="#f3f7fb" stroke="#a8becd"/>
  <text x="84" y="646" fill="#17343a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Apply rules and run reviewed methods</text>
  <text x="84" y="676" fill="#4f676d" font-family="Inter, Arial, sans-serif" font-size="14">Choose who can use each dataset, what may be sent</text>
  <text x="84" y="702" fill="#4f676d" font-family="Inter, Arial, sans-serif" font-size="14">to an approved model, and which methods can run.</text>
  <text x="84" y="728" fill="#4f676d" font-family="Inter, Arial, sans-serif" font-size="14">Keep settings, versions, logs, and generated files.</text>

  <line x1="340" y1="760" x2="340" y2="798" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="62" y="832" fill="#0e6964" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">03  WORK WITH THE DATA</text>
  <rect x="62" y="850" width="556" height="124" rx="6" fill="#f4f7f8" stroke="#b8c5cc"/>
  <text x="84" y="884" fill="#17343a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Explore, find cohorts, and analyze</text>
  <text x="84" y="914" fill="#4f676d" font-family="Inter, Arial, sans-serif" font-size="14">Follow patients over time, review assays and images,</text>
  <text x="84" y="940" fill="#4f676d" font-family="Inter, Arial, sans-serif" font-size="14">save patient groups, compare, plot, and run methods.</text>

  <line x1="340" y1="974" x2="340" y2="1012" stroke="#5f7482" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="62" y="1018" width="556" height="82" rx="6" fill="#edf6ee" stroke="#9fc3a5"/>
  <text x="84" y="1052" fill="#203d27" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Keep results understandable</text>
  <text x="84" y="1078" fill="#4b6852" font-family="Inter, Arial, sans-serif" font-size="14">Retain what is needed to review or repeat a result.</text>

  <text x="340" y="1158" fill="#526571" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Source systems keep the data. COHORTome provides the workspace.</text>
</svg>
