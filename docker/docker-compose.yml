services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cohortome:pilot
    env_file:
      - path: env.example
        required: true
      - path: .env
        required: false
    environment:
      COHORTOME_JOBS_REDIS_URL: redis://redis:6379/0
      COHORTOME_RUNTIME_ROOT: /var/lib/cohortome
    ports:
      - "8000:8000"
    volumes:
      - cohortome-runtime:/var/lib/cohortome
      - ../default_dataset:/app/default_dataset:ro
      - ../private_dataset:/app/private_dataset:ro
      - ../dataset-large:/app/dataset-large:ro
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: cohortome:pilot
    env_file:
      - path: env.example
        required: true
      - path: .env
        required: false
    environment:
      COHORTOME_JOBS_REDIS_URL: redis://redis:6379/0
      COHORTOME_RUNTIME_ROOT: /var/lib/cohortome
    command: ["rq", "worker", "analysis", "--url", "redis://redis:6379/0"]
    volumes:
      - cohortome-runtime:/var/lib/cohortome
      - ../default_dataset:/app/default_dataset:ro
      - ../private_dataset:/app/private_dataset:ro
      - ../dataset-large:/app/dataset-large:ro
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  orthanc:
    image: orthancteam/orthanc:latest
    profiles: ["dicom"]
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
    restart: unless-stopped

  ohif:
    image: ohif/app:latest
    profiles: ["dicom"]
    ports:
      - "${COHORTOME_OHIF_HOST_PORT:-3000}:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./ohif/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orthanc:
        condition: service_started
    restart: unless-stopped

volumes:
  cohortome-runtime:
  redis-data:
  orthanc-data:
