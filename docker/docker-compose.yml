services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cohortome:pilot
    env_file:
      - path: env.example
        required: true
      - path: .env
        required: false
    environment:
      COHORTOME_JOBS_REDIS_URL: redis://redis:6379/0
      COHORTOME_RUNTIME_ROOT: /var/lib/cohortome
    ports:
      - "8000:8000"
    volumes:
      - cohortome-runtime:/var/lib/cohortome
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: cohortome:pilot
    env_file:
      - path: env.example
        required: true
      - path: .env
        required: false
    environment:
      COHORTOME_JOBS_REDIS_URL: redis://redis:6379/0
      COHORTOME_RUNTIME_ROOT: /var/lib/cohortome
    command: ["rq", "worker", "analysis", "--url", "redis://redis:6379/0"]
    volumes:
      - cohortome-runtime:/var/lib/cohortome
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  orthanc:
    image: orthancteam/orthanc:latest
    profiles: ["dicom"]
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
    restart: unless-stopped

volumes:
  cohortome-runtime:
  redis-data:
  orthanc-data:
