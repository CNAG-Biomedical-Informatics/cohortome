services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: biomedical-research-navigator:pilot
    env_file:
      - path: env.example
        required: true
      - path: .env
        required: false
    environment:
      BRN_JOBS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../state:/app/state
      - ../.cache:/app/.cache
      - ../runs:/app/runs
      - ../default_dataset:/app/default_dataset:ro
      - ../private_dataset:/app/private_dataset:ro
      - ../dataset-large:/app/dataset-large:ro
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: biomedical-research-navigator:pilot
    env_file:
      - path: env.example
        required: true
      - path: .env
        required: false
    environment:
      BRN_JOBS_REDIS_URL: redis://redis:6379/0
    command: ["rq", "worker", "analysis", "--url", "redis://redis:6379/0"]
    volumes:
      - ../state:/app/state
      - ../.cache:/app/.cache
      - ../runs:/app/runs
      - ../default_dataset:/app/default_dataset:ro
      - ../private_dataset:/app/private_dataset:ro
      - ../dataset-large:/app/dataset-large:ro
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  orthanc:
    image: orthancteam/orthanc:latest
    profiles: ["dicom"]
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
    restart: unless-stopped

  ohif:
    image: ohif/app:latest
    profiles: ["dicom"]
    ports:
      - "3000:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      orthanc:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  orthanc-data:
